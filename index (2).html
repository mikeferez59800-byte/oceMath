/* ---------- Couleurs : peu de couleurs, bon contraste ---------- */
:root{
  --fond:#FFF7EC;
  --carte:#FFFFFF;
  --encre:#1F2A44;
  --doux:#56607A;
  --bleu:#1D4E89;
  --bleu-clair:#E3ECF8;
  --orange:#D9620F;
  --orange-clair:#FDE9D6;
  --vert:#23804D;
  --vert-clair:#DDF2E5;
  --rouge:#C0392B;
  --or:#E7B416;
  --gris:#C9CED8;
  --rayon:24px;
  --ombre:0 5px 0 rgba(31,42,68,.22);
  --touche:clamp(64px, 10.5vmin, 96px);
  --texte:clamp(20px, 3.1vmin, 32px);
  --titre:clamp(28px, 5vmin, 52px);
}

/* ---------- Tablette : pas de zoom, pas de sélection, pas de menu au appui long ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--fond);color:var(--encre);
  font-family:'Andika','Andika New Basic','Arial Rounded MT Bold',Verdana,sans-serif;
  touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;}
body{position:fixed;inset:0;}
img,svg{-webkit-user-drag:none;}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation;padding:0;}
button:disabled{opacity:.4;}

/* ---------- Écrans ---------- */
.ecran{position:absolute;inset:0;display:none;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
.ecran.actif{display:flex;}

/* ---------- Boutons ---------- */
.btn{white-space:nowrap;min-height:72px;min-width:72px;padding:10px 28px;border-radius:var(--rayon);background:var(--bleu);color:#fff;
  font-size:var(--texte);font-weight:700;box-shadow:var(--ombre);display:inline-flex;align-items:center;justify-content:center;gap:12px;line-height:1.1;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(31,42,68,.22);}
.btn.orange{background:var(--orange);}
.btn.vert{background:var(--vert);}
.btn.blanc{background:#fff;color:var(--bleu);border:3px solid var(--bleu);}
.btn.grand{min-height:clamp(84px,13vmin,120px);font-size:clamp(26px,4.4vmin,44px);padding:12px 36px;}
.btn-rond{width:var(--touche);height:var(--touche);min-width:64px;min-height:64px;border-radius:50%;background:#fff;border:3px solid var(--bleu);
  font-size:clamp(28px,4.6vmin,42px);display:flex;align-items:center;justify-content:center;box-shadow:var(--ombre);flex:none;}
.btn-rond:active{transform:translateY(4px);box-shadow:none;}
.btn-mini{min-height:64px;min-width:64px;padding:8px 18px;border-radius:18px;background:#fff;border:3px solid var(--gris);
  font-size:clamp(18px,2.6vmin,26px);font-weight:700;color:var(--doux);}

/* ---------- Barre du haut ---------- */
.barre{display:flex;align-items:center;justify-content:space-between;gap:2vmin;padding:1.6vmin 3vmin;min-height:clamp(80px,12vmin,110px);flex:none;}
.barre h1,.barre h2{margin:0;font-size:var(--titre);text-align:center;flex:1;}
.espace{width:var(--touche);flex:none;}

/* ---------- Accueil ---------- */
#ecran-accueil{background:linear-gradient(to bottom,var(--fond) 0,var(--fond) 72%,#F3DCC0 72%,#F3DCC0 100%);}
.accueil-corps{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:5vmin;padding:2vmin 4vmin 4vmin;}
.accueil-heros{display:flex;flex-direction:column;align-items:center;gap:1vmin;min-height:0;}
.accueil-heros .gym-svg{height:min(52vh,52vw);width:auto;}
.accueil-heros .nom{font-size:var(--titre);font-weight:700;}
.accueil-boutons{display:flex;flex-direction:column;gap:2.4vmin;min-width:min(42vw,440px);}
.accueil-boutons .btn{width:100%;}
.panneau-gym{font-size:clamp(20px,3vmin,30px);color:var(--bleu);font-weight:700;background:#fff;border:3px solid var(--bleu);border-radius:999px;padding:6px 22px;}
@media (orientation:portrait){
  .accueil-corps{flex-direction:column;gap:3vmin;}
  .accueil-heros .gym-svg{height:34vh;}
  #ecran-accueil{background:linear-gradient(to bottom,var(--fond) 0,var(--fond) 88%,#F3DCC0 88%,#F3DCC0 100%);}
  .accueil-boutons{min-width:min(80vw,520px);}
}

/* ---------- Choix de l'agrès ---------- */
.grille-agres{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:3vmin;padding:1vmin 5vmin 5vmin;}
@media (orientation:portrait){.grille-agres{grid-template-columns:repeat(2,1fr);}}
.carte-agres{background:#fff;border-radius:28px;box-shadow:var(--ombre);border:3px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;padding:2vmin;min-height:0;}
.carte-agres:active{transform:translateY(4px);box-shadow:none;}
.carte-agres svg{height:min(16vmin,130px);width:auto;}
.carte-agres .t{font-size:clamp(22px,3.4vmin,34px);font-weight:700;text-align:center;}
.carte-agres .m{font-size:clamp(16px,2.4vmin,22px);color:var(--doux);font-weight:700;}
.carte-agres.maths{border-color:var(--bleu-clair);}
.carte-agres.francais{border-color:var(--orange-clair);}

/* ---------- Écran de jeu ---------- */
.etoiles{display:flex;gap:1.2vmin;}
.etoiles svg{width:clamp(40px,6.5vmin,62px);height:auto;}
.btn-ecouter{min-height:clamp(72px,10vmin,96px);padding:8px 22px;border-radius:999px;background:var(--orange);color:#fff;font-size:var(--texte);font-weight:700;box-shadow:var(--ombre);display:flex;align-items:center;gap:10px;flex:none;}
.btn-ecouter:active{transform:translateY(4px);box-shadow:none;}
.consigne{flex:none;text-align:center;font-size:clamp(22px,3.6vmin,36px);font-weight:700;padding:0 4vmin 1vmin;min-height:1.4em;line-height:1.25;}
.consigne.aide{color:var(--orange);}
.zone-jeu{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:2.5vmin;padding:0 3vmin 3vmin;}
.zone-jeu.plein{grid-template-columns:minmax(0,1fr);}
.zone-jeu.plein .reponses{display:none;}
@media (orientation:portrait){
  .zone-jeu{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;}
  .zone-jeu.plein{grid-template-rows:minmax(0,1fr);}
}
.scene{min-height:0;min-width:0;background:var(--carte);border-radius:30px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:2vmin;}
.reponses{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;transition:opacity .3s;}
.reponses.inactif{opacity:.3;pointer-events:none;}
.scene-col{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5vmin;min-height:0;}
.svg-scene{width:100%;flex:1;min-height:0;}
.coin{position:absolute;right:1.5vmin;bottom:1.5vmin;}

/* Pavé numérique intégré (le clavier de la tablette ne s'ouvre jamais) */
.pave{display:flex;flex-direction:column;gap:1.4vmin;align-items:stretch;}
.pave-ecran{height:calc(var(--touche) * 1.05);border-radius:20px;background:#fff;border:4px solid var(--bleu);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--touche) * .7);font-weight:700;color:var(--bleu);}
.pave-ecran .vide{color:var(--gris);}
.pave-touches{display:grid;grid-template-columns:repeat(3,var(--touche));gap:1.4vmin;}
.touche{width:var(--touche);height:var(--touche);border-radius:20px;background:#fff;box-shadow:var(--ombre);font-size:calc(var(--touche) * .5);font-weight:700;border:3px solid var(--bleu-clair);}
.touche:active{transform:translateY(4px);box-shadow:none;background:var(--bleu-clair);}
.touche.valide{background:var(--vert);color:#fff;border-color:var(--vert);}
.touche.efface{color:var(--doux);}
@media (orientation:portrait){
  .pave{flex-direction:row;align-items:center;gap:3vmin;}
  .pave-ecran{width:calc(var(--touche) * 1.9);height:calc(var(--touche) * 1.4);}
  .pave-touches{grid-template-columns:repeat(6,var(--touche));}
}

/* Boutons de choix (syllabes, signes…) */
.choix-grille{display:flex;flex-direction:column;gap:2.4vmin;align-items:stretch;justify-content:center;width:100%;max-width:440px;}
@media (orientation:portrait){.choix-grille{flex-direction:row;flex-wrap:wrap;max-width:none;justify-content:center;}}
.btn-choix{min-height:clamp(80px,13vmin,124px);min-width:clamp(110px,18vmin,180px);border-radius:26px;background:#fff;border:4px solid var(--bleu);color:var(--encre);
  font-size:clamp(36px,7vmin,68px);font-weight:700;box-shadow:var(--ombre);padding:4px 20px;}
.btn-choix:active{transform:translateY(4px);box-shadow:none;}
.btn-choix.ecarte{opacity:.25;pointer-events:none;}
.btn-choix.bonne{background:var(--vert-clair);border-color:var(--vert);}
.btn-choix .petit{display:block;font-size:.34em;color:var(--doux);}

/* Calcul en grand */
.calcul{font-size:clamp(44px,9vmin,96px);font-weight:700;letter-spacing:.04em;white-space:nowrap;}
.trou{display:inline-block;min-width:1.3em;text-align:center;color:var(--orange);border-bottom:6px solid var(--orange);}
.trou.rempli{color:var(--vert);border-color:var(--vert);}

/* ---------- Maison des nombres (plinthe) ---------- */
.maison-scene{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:5vmin;}
@media (orientation:portrait){.maison-scene{flex-direction:column;gap:2vmin;}}
.maison{display:flex;flex-direction:column;align-items:center;gap:.8vmin;}
.toit{width:clamp(150px,26vmin,260px);height:clamp(60px,10vmin,100px);background:var(--orange);color:#fff;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);
  display:flex;align-items:center;justify-content:center;font-size:clamp(36px,7vmin,68px);font-weight:700;border-radius:8px;}
.etage{display:flex;gap:.8vmin;}
.etage span{width:clamp(66px,11.5vmin,116px);height:clamp(48px,7.4vmin,74px);background:#F1D2A6;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(28px,5vmin,48px);font-weight:700;}
.etage.courant span{background:#fff;border:4px solid var(--bleu);}
.etage.courant span.trou{border:4px dashed var(--orange);color:var(--orange);}
.etage.courant span.trou.rempli{border-style:solid;border-color:var(--vert);color:var(--vert);}
.jetons{display:grid;grid-template-columns:repeat(2,auto);gap:1.2vmin;}
@media (orientation:portrait){.jetons{grid-template-columns:repeat(5,auto);}}
.jeton{width:clamp(48px,8vmin,72px);height:clamp(48px,8vmin,72px);border-radius:50%;background:var(--bleu);border:4px solid var(--bleu);}
.jeton.inconnu{background:var(--orange-clair);border:4px dashed var(--orange);}
.jeton.neutre{background:var(--orange);border-color:var(--orange);}
.jeton.neutre.retourne{background:var(--bleu);border-color:var(--bleu);}
.jeton.solution{background:var(--orange);border:4px solid var(--orange);}

/* ---------- Fusion de syllabes ---------- */
.fusion{display:flex;align-items:center;justify-content:center;gap:2.4vmin;transition:gap .5s;}
.tuile{min-width:clamp(90px,16vmin,160px);height:clamp(110px,19vmin,190px);border-radius:24px;background:#fff;border:5px solid var(--bleu);
  font-size:clamp(56px,11vmin,110px);font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 12px;box-shadow:var(--ombre);position:relative;}
.tuile.voyelle{border-color:var(--orange);}
.tuile .hp{position:absolute;bottom:4px;right:8px;font-size:clamp(16px,2.6vmin,24px);}
.tuile.resultat{border-style:dashed;color:var(--orange);}
.tuile.resultat.rempli{border-style:solid;border-color:var(--vert);color:var(--vert);}
.op{font-size:clamp(40px,7vmin,70px);font-weight:700;color:var(--doux);transition:opacity .4s;}
.fusion.fusionne{gap:0;}
.fusion > *{transition:all .5s ease-in-out;}
.fusion.fusionne > :not(.resultat){opacity:0;min-width:0;width:0;padding:0;border-width:0;margin:0;overflow:hidden;font-size:0;}
.cases{display:flex;gap:1.5vmin;}
.case{width:clamp(100px,17vmin,170px);height:clamp(120px,20vmin,200px);border-radius:24px;border:5px dashed var(--gris);display:flex;align-items:center;justify-content:center;
  font-size:clamp(56px,11vmin,110px);font-weight:700;background:#fff;}
.case.remplie{border-style:solid;border-color:var(--bleu);}
.case.survol{background:var(--bleu-clair);}
.cartes-lettres{display:flex;flex-direction:column;gap:2.4vmin;align-items:center;}
.rangee{display:flex;gap:2vmin;justify-content:center;}
.carte-lettre{width:var(--touche);height:calc(var(--touche) * 1.15);border-radius:20px;background:#fff;border:4px solid var(--bleu);font-size:calc(var(--touche) * .6);font-weight:700;
  box-shadow:var(--ombre);touch-action:none;display:flex;align-items:center;justify-content:center;}
.carte-lettre.voyelle{border-color:var(--orange);}
.carte-lettre.saisie{box-shadow:0 12px 24px rgba(0,0,0,.25);z-index:5;position:relative;}
.carte-lettre.ecarte{opacity:.25;pointer-events:none;}
.dessin{display:block;}
.dessin-grand{width:clamp(130px,24vmin,230px);height:clamp(130px,24vmin,230px);}
.case-syl{width:auto;min-width:clamp(100px,16vmin,160px);padding:0 10px;font-size:clamp(44px,8vmin,80px);}
.carte-syl{width:auto;min-width:var(--touche);padding:0 14px;font-size:calc(var(--touche) * .5);}
.carte-syl.posee{opacity:.25;pointer-events:none;}
.mot-lire{font-size:clamp(56px,11vmin,110px);font-weight:700;letter-spacing:.03em;}
.syl-a{color:var(--bleu);} .syl-b{color:var(--orange);}
.carte-dessin{width:clamp(120px,20vmin,190px);height:clamp(120px,20vmin,190px);border-radius:26px;background:#fff;border:4px solid var(--bleu-clair);box-shadow:var(--ombre);padding:12px;}
.carte-dessin .dessin{width:100%;height:100%;}
.carte-dessin:active{transform:translateY(4px);box-shadow:none;}
.carte-dessin.ecarte{opacity:.2;pointer-events:none;}
.carte-dessin.bonne{border-color:var(--vert);background:var(--vert-clair);}
.ecoute-grand{width:clamp(96px,16vmin,150px);height:clamp(96px,16vmin,150px);border-radius:50%;background:var(--orange);color:#fff;font-size:clamp(44px,8vmin,76px);box-shadow:var(--ombre);}
.ecoute-grand:active{transform:translateY(4px);box-shadow:none;}

/* ---------- Attrape la syllabe : cerceaux ---------- */
.cerceaux{display:grid;gap:3vmin;width:100%;height:100%;align-content:center;justify-items:center;}
.cerceau{width:clamp(130px,24vmin,230px);height:clamp(130px,24vmin,230px);border-radius:50%;border:clamp(10px,1.8vmin,16px) solid #7E57C2;background:#fff;
  font-size:clamp(44px,8.5vmin,86px);font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:var(--ombre);}
.cerceau:active{transform:translateY(4px);box-shadow:none;}
.cerceau.ecarte{opacity:.2;pointer-events:none;}
.cerceau.bonne{border-color:var(--vert);background:var(--vert-clair);}

/* ---------- Gymnaste et figures ---------- */
.gym-svg{display:block;overflow:visible;}
.ico{width:1.2em;height:1.2em;flex:none;display:inline-block;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
.btn-rond .ico{width:1.25em;height:1.25em;color:var(--bleu);}
.touche .ico{width:.9em;height:.9em;}
.tuile .hp .ico{width:1em;height:1em;color:var(--doux);}
.ecoute-grand .ico{width:.8em;height:.8em;}
.recomp.verrou .ico{width:.9em;height:.9em;}
.pastille.legende{display:inline-block;width:14px;height:14px;vertical-align:-1px;}
.pause-gym{height:min(24vh,24vw);width:auto;}
.anime{transform-origin:50% 60%;}
.fig-saut{animation:figSaut 1.1s ease-in-out;}
.fig-roulade{animation:figRoulade 1.1s ease-in-out;}
.fig-roue{animation:figRoue 1.2s ease-in-out;}
.fig-salto{animation:figSalto 1.2s ease-in-out;}
.fig-vrille{animation:figVrille 1.2s ease-in-out;}
.fig-etoile{animation:figEtoile 1.2s ease-in-out;}
@keyframes figSaut{0%{transform:translateY(0)}15%{transform:translateY(4%) scaleY(.92)}45%{transform:translateY(-32%)}75%{transform:translateY(0)}88%{transform:translateY(-6%)}100%{transform:translateY(0)}}
@keyframes figRoulade{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(22%) scale(.75) rotate(120deg)}70%{transform:translateY(22%) scale(.75) rotate(300deg)}100%{transform:translateY(0) scale(1) rotate(360deg)}}
@keyframes figRoue{0%{transform:translateX(0) rotate(0)}50%{transform:translateX(40%) rotate(180deg)}100%{transform:translateX(0) rotate(360deg)}}
@keyframes figSalto{0%{transform:translateY(0) rotate(0)}15%{transform:translateY(5%) scaleY(.9)}55%{transform:translateY(-42%) rotate(-250deg)}85%{transform:translateY(0) rotate(-360deg)}100%{transform:translateY(0) rotate(-360deg)}}
@keyframes figVrille{0%{transform:translateY(0) scaleX(1)}25%{transform:translateY(-28%) scaleX(-1)}50%{transform:translateY(-36%) scaleX(1)}75%{transform:translateY(-28%) scaleX(-1)}100%{transform:translateY(0) scaleX(1)}}
@keyframes figEtoile{0%{transform:scale(1)}30%{transform:translateY(-26%) scale(1.18) rotate(-12deg)}60%{transform:translateY(-26%) scale(1.18) rotate(12deg)}100%{transform:translateY(0) scale(1) rotate(0)}}
.pop{animation:pop .35s ease-out;}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.fig-saut,.fig-roulade,.fig-roue,.fig-salto,.fig-vrille,.fig-etoile{animation-duration:.01s;}}

/* ---------- Voiles (bravo, médaille, continuer) ---------- */
.voile{position:absolute;inset:0;background:rgba(255,247,236,.94);display:none;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:2vmin;}
.voile.actif{display:flex;}
.voile .gym-svg{height:min(46vh,46vw);width:auto;}
.bravo-texte{font-size:clamp(40px,8vmin,80px);font-weight:700;color:var(--vert);text-align:center;}
.bravo-sous{font-size:clamp(22px,3.6vmin,36px);font-weight:700;color:var(--orange);text-align:center;}
#btn-continuer{position:absolute;left:50%;bottom:calc(3vmin + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:15;display:none;}
#btn-continuer.actif{display:inline-flex;}
#btn-continuer:active{transform:translateX(-50%) translateY(4px);}

/* ---------- Médaille, pause, fin ---------- */
.centre{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vmin;padding:3vmin;text-align:center;}
.centre h2{margin:0;font-size:var(--titre);}
.centre p{margin:0;font-size:clamp(22px,3.6vmin,36px);font-weight:700;color:var(--doux);max-width:900px;}
.medaille-grande{height:min(36vh,36vw);width:auto;}
.rangee-btn{display:flex;gap:3vmin;flex-wrap:wrap;justify-content:center;}
.nouveau{background:var(--orange-clair);border-radius:20px;padding:10px 24px;color:var(--orange) !important;}
.compte-rebours{width:min(34vh,34vw);height:min(34vh,34vw);}
.exo-emoji{font-size:clamp(60px,12vmin,120px);line-height:1;}

/* ---------- Vitrine ---------- */
.vitrine-corps{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:1vmin 5vmin 5vmin;display:flex;flex-direction:column;gap:3vmin;}
.etagere{display:flex;justify-content:center;gap:6vmin;background:#fff;border-radius:28px;padding:2.5vmin;border-bottom:14px solid #C98B4A;}
.etagere .m{display:flex;flex-direction:column;align-items:center;font-size:clamp(28px,5vmin,48px);font-weight:700;}
.etagere svg{height:clamp(80px,14vmin,130px);width:auto;}
.prochain{font-size:clamp(20px,3.2vmin,30px);font-weight:700;text-align:center;color:var(--bleu);}
.recomp-titre{font-size:clamp(22px,3.6vmin,34px);font-weight:700;margin:0;}
.recomp-grille{display:flex;flex-wrap:wrap;gap:2vmin;}
.recomp{width:clamp(110px,17vmin,160px);min-height:clamp(120px,19vmin,180px);background:#fff;border-radius:22px;box-shadow:var(--ombre);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;font-size:clamp(16px,2.4vmin,22px);font-weight:700;text-align:center;}
.recomp .gym-svg{height:clamp(70px,11vmin,110px);width:auto;}
.recomp.verrou{opacity:.45;box-shadow:none;border:3px dashed var(--gris);}
.recomp .ico{font-size:clamp(36px,6vmin,56px);}

/* ---------- Création du gymnaste ---------- */
.crea-corps{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:4vmin;padding:1vmin 4vmin 3vmin;}
@media (orientation:portrait){.crea-corps{flex-direction:column;gap:2vmin;}}
.crea-apercu .gym-svg{height:min(50vh,40vw);width:auto;}
@media (orientation:portrait){.crea-apercu .gym-svg{height:28vh;}}
.crea-droite{display:flex;flex-direction:column;gap:2.5vmin;align-items:center;min-width:0;}
.crea-question{font-size:clamp(26px,4.4vmin,44px);font-weight:700;text-align:center;}
.options{display:flex;flex-wrap:wrap;gap:2vmin;justify-content:center;max-width:640px;}
.opt{width:clamp(80px,13vmin,124px);height:clamp(80px,13vmin,124px);border-radius:24px;background:#fff;border:5px solid var(--gris);display:flex;align-items:center;justify-content:center;box-shadow:var(--ombre);}
.opt.choisi{border-color:var(--orange);box-shadow:0 0 0 5px var(--orange-clair),var(--ombre);}
.opt .pastille-couleur{width:70%;height:70%;border-radius:50%;}
.opt .gym-svg{height:92%;width:auto;}
.opt.verrou{opacity:.35;}
.nom-affiche{min-width:min(60vw,420px);min-height:clamp(70px,11vmin,100px);border-radius:20px;background:#fff;border:4px solid var(--bleu);font-size:clamp(34px,6vmin,58px);font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 20px;}
.pave-lettres{display:grid;grid-template-columns:repeat(8,minmax(64px,clamp(64px,8.2vmin,84px)));gap:1vmin;}
.pave-lettres .touche{width:auto;height:clamp(64px,8.2vmin,84px);font-size:clamp(26px,4.2vmin,40px);}
@media (orientation:portrait){.pave-lettres{grid-template-columns:repeat(8,minmax(64px,10.4vmin));}.pave-lettres .touche{height:clamp(64px,9vmin,90px);}}

/* ---------- Porte des parents et espace parent ---------- */
.porte{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:5vmin;padding:2vmin;}
@media (orientation:portrait){.porte{flex-direction:column;}}
.parent-onglets{display:flex;gap:1.2vmin;padding:0 3vmin 1.5vmin;flex-wrap:wrap;flex:none;}
.onglet{min-height:64px;padding:8px 18px;border-radius:18px;background:#fff;border:3px solid var(--bleu-clair);font-size:clamp(16px,2.4vmin,22px);font-weight:700;color:var(--bleu);}

.parent-corps{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:0 4vmin 5vmin;font-size:clamp(17px,2.4vmin,22px);line-height:1.45;}
.parent-corps h3{font-size:clamp(20px,3vmin,28px);margin:2.2vmin 0 1vmin;color:var(--bleu);}
.parent-corps p{margin:.6em 0;}
.bloc{background:#fff;border-radius:20px;padding:2vmin 3vmin;margin-bottom:2vmin;}
.ligne-comp{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid #EEE;}
.ligne-comp:last-child{border-bottom:none;}
.pastille{width:22px;height:22px;border-radius:50%;flex:none;}
.pastille.vert{background:#2E9E5B;} .pastille.orange{background:#EF8A17;} .pastille.rouge{background:#D6453D;} .pastille.gris{background:var(--gris);}
.barre-temps{height:22px;border-radius:11px;background:var(--bleu);min-width:4px;}
.tableau{width:100%;border-collapse:collapse;}
.tableau td{padding:8px 6px;border-bottom:1px solid #EEE;vertical-align:middle;}
.bascules{display:flex;flex-wrap:wrap;gap:10px;}
.bascule{min-height:64px;min-width:64px;padding:8px 18px;border-radius:16px;background:#fff;border:3px solid var(--gris);font-size:clamp(18px,2.6vmin,24px);font-weight:700;color:var(--doux);}

.note{color:var(--doux);font-size:.92em;}

/* Assombrir une couleur hexadécimale (pour les ombres des tenues) */
function assombrir(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.round(c * (1 - k)));
  return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(c => c.toString(16).padStart(2, '0')).join('');
}

/* Étoile SVG à 5 branches (renvoie les points d'un polygone) */
function pointsEtoile(cx, cy, R, r) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 ? r : R;
    pts.push((cx + rr * Math.cos(ang)).toFixed(1) + ',' + (cy + rr * Math.sin(ang)).toFixed(1));
  }
  return pts.join(' ');
}

/* Fusionne une sauvegarde avec les valeurs par défaut (utile quand l'appli ajoute de nouveaux réglages) */
function fusionner(def, obj) {
  if (!obj || typeof obj !== 'object') return def;
  for (const k of Object.keys(obj)) {
    const d = def[k], o = obj[k];
    if (d && typeof d === 'object' && !Array.isArray(d) && Object.keys(d).length && o && typeof o === 'object' && !Array.isArray(o)) def[k] = fusionner(d, o);
    else if (o !== undefined) def[k] = o;
  }
  return def;
}

  return etatParDefaut();

/* =====================================================================
   4. SONS ORIGINAUX (Web Audio) : fanfare, applaudissements, boing…
   ===================================================================== */
const Sons = {
  ctx: null,
  activer() { // à appeler lors d'un premier toucher (règle des navigateurs)
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  note(freq, debut, duree, type = 'triangle', vol = 0.18) {
    const c = this.ctx, t = c.currentTime + debut;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + duree + 0.05);
  },
  bruit(debut, duree, vol) { // petit « clap » de bruit filtré
    const c = this.ctx, t = c.currentTime + debut;
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * duree), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1200 + Math.random() * 1600; f.Q.value = 0.8;
    const g = c.createGain(); g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination); s.start(t);
  },
  jouer(nom) {
    if (!etat.reglages.sons) return;
    this.activer(); if (!this.ctx) return;
    try {
      switch (nom) {
        case 'clic': this.note(660, 0, 0.06, 'sine', 0.06); break;
        case 'joie': this.note(784, 0, 0.14); this.note(1046, 0.1, 0.22); break;
        case 'oups': this.note(392, 0, 0.16, 'sine', 0.1); this.note(330, 0.12, 0.22, 'sine', 0.08); break; // doux, jamais punitif
        case 'boing': {
          const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
          o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(520, t + 0.12); o.frequency.exponentialRampToValueAtTime(260, t + 0.38);
          lfo.frequency.value = 22; lg.gain.value = 25; lfo.connect(lg).connect(o.frequency);
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
          o.connect(g).connect(c.destination); o.start(t); lfo.start(t); o.stop(t + 0.45); lfo.stop(t + 0.45);
          break;
        }
        case 'fanfare': { // petite fanfare originale
          const n = [[523, 0, .14], [659, .14, .14], [784, .28, .14], [1046, .42, .4], [784, .82, .12], [1046, .94, .55]];
          n.forEach(([f, d, du]) => { this.note(f, d, du, 'square', 0.07); this.note(f / 2, d, du, 'triangle', 0.1); });
          break;
        }
        case 'applaudissements':
          for (let i = 0; i < 46; i++) this.bruit(0.9 + Math.random() * 1.5, 0.05 + Math.random() * 0.04, 0.25 + Math.random() * 0.25);
          break;
        case 'tic': this.note(880, 0, 0.05, 'sine', 0.05); break;
      }
    } catch (e) { /* le son n'est jamais bloquant */ }
  },
};

/* =====================================================================
   5. VOIX FRANÇAISE (Web Speech API)
   ===================================================================== */
const Voix = {
  voix: null, dernier: '',
  init() {
    if (!('speechSynthesis' in window)) return;
    const choisir = () => {
      const vs = speechSynthesis.getVoices();
      // 1) la voix choisie dans l'espace parent, 2) une voix « améliorée » ou « premium », 3) une voix française connue
      this.voix = vs.find(v => v.name === etat.reglages.nomVoix)
        || vs.find(v => (v.lang || '').startsWith('fr') && /premium|enhanced|améliorée|natural|neural/i.test(v.name))
        || vs.find(v => v.lang === 'fr-FR' && /amélie|amelie|audrey|marie|thomas|google|denise|julie/i.test(v.name))
        || vs.find(v => v.lang === 'fr-FR') || vs.find(v => (v.lang || '').toLowerCase().startsWith('fr')) || null;
    };
    this.choisir = choisir;
    choisir();
    speechSynthesis.onvoiceschanged = choisir;
  },
  dire(texte, fin) {
    if (!texte) { fin && fin(); return; }
    this.dernier = texte;
    if (!('speechSynthesis' in window)) { fin && fin(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texte);
      u.lang = 'fr-FR'; if (this.voix) u.voice = this.voix;
      u.rate = etat.reglages.vitesseVoix || 0.9; u.pitch = 1;
      if (fin) { let fait = false; const f = () => { if (!fait) { fait = true; fin(); } }; u.onend = f; u.onerror = f; }
      setTimeout(() => speechSynthesis.speak(u), 60); // petit délai : évite un bug de Chrome après cancel()
    } catch (e) { fin && fin(); }
  },
  /* Voix françaises installées sur la tablette (pour le choix dans l'espace parent) */
  francaises() { try { return speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().startsWith('fr')); } catch (e) { return []; } },
  taire() { try { speechSynthesis.cancel(); } catch (e) {} },
};

/* =====================================================================
   7. INTERACTIONS : pavés intégrés, glisser-déposer au doigt
   ===================================================================== */
/* Pavé numérique intégré : le clavier de la tablette ne s'ouvre jamais */
function creerPave(conteneur, { max = 3, onValider }) {
  conteneur.innerHTML = `<div class="pave">
    <div class="pave-ecran"><span class="pave-valeur vide">?</span></div>
    <div class="pave-touches">
      ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="touche" data-t="${n}">${n}</button>`).join('')}
      <button class="touche efface" data-t="efface" aria-label="Effacer">${ICONES.effacer}</button>
      <button class="touche" data-t="0">0</button>
      <button class="touche valide" data-t="ok" aria-label="Valider">${ICONES.valider}</button>
    </div></div>`;
  let val = '';
  const aff = $('.pave-valeur', conteneur), ok = $('[data-t="ok"]', conteneur);
  const maj = () => { aff.textContent = val || '?'; aff.classList.toggle('vide', !val); ok.disabled = !val; };
  $$('.touche', conteneur).forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.t;
    if (t === 'efface') val = val.slice(0, -1);
    else if (t === 'ok') { if (val) onValider(val); return; }
    else if (val.length < max) val = (val === '0' ? '' : val) + t;
    Sons.jouer('clic'); maj();
  }));
  maj();
  return { vider() { val = ''; maj(); }, get valeur() { return val; } };
}

/* Glisser-déposer au doigt (Pointer Events) avec, toujours, l'alternative du simple appui.
   el      : l'élément à déplacer
   cibles  : fonction qui renvoie les éléments où l'on peut déposer
   onDepot : appelé avec la cible quand on lâche dessus
   onAppui : appelé quand on touche sans glisser (alternative par simple appui) */
function rendreDeplacable(el, { cibles, onDepot, onAppui }) {
  let debut = null, bouge = false;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    debut = { x: e.clientX, y: e.clientY }; bouge = false;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    el.classList.add('saisie');
  });
  el.addEventListener('pointermove', e => {
    if (!debut) return;
    const dx = e.clientX - debut.x, dy = e.clientY - debut.y;
    if (Math.hypot(dx, dy) > 12) bouge = true;
    if (bouge) {
      el.style.transform = `translate(${dx}px, ${dy}px)`;
      cibles().forEach(c => { const r = c.getBoundingClientRect(); c.classList.toggle('survol', e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom); });
    }
  });
  const fin = e => {
    if (!debut) return;
    el.style.transform = ''; el.classList.remove('saisie');
    const etaitBouge = bouge; debut = null;
    cibles().forEach(c => c.classList.remove('survol'));
    if (!etaitBouge) { onAppui && onAppui(); return; }
    const cible = cibles().find(c => { const r = c.getBoundingClientRect(); return e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom; });
    if (cible) onDepot(cible);
  };
  el.addEventListener('pointerup', fin);
  el.addEventListener('pointercancel', () => { debut = null; el.style.transform = ''; el.classList.remove('saisie'); });
}

/* =====================================================================
   9. CATALOGUE DES JEUX : chaque jeu est un module autonome
   =====================================================================
   enregistrerJeu({
     id, nom, niveau:'CP', matiere:'maths'|'francais', agres, competence,
     disposition: 'deux' (scène + réponses) | 'plein' (tout dans la scène),
     paliers: [{ nom, periode, ...paramètres }],
     generer(palier, contexte) -> question     (fabrique une question au hasard)
     consigne(q) -> texte | { texte, voix }     (court, simple, positif)
     afficher(q, scene, reponses, api)          (dessine la question)
     verifier(q, reponse) -> vrai/faux
     indice(q, api, reponse) -> texte          (après la 1re erreur)
     solution(q, api) -> texte                 (après la 2e erreur : montre et explique)
     bravo(q, api)                             (facultatif : petite animation de réussite)
   }) */
const JEUX = {};
const COMPETENCES = {}; // id -> { nom, explication, niveau }
function enregistrerJeu(j) { JEUX[j.id] = j; }
function enregistrerCompetence(id, nom, explication, niveau) { COMPETENCES[id] = { id, nom, explication, niveau }; }
const jeuxDuNiveau = (niv = etat.reglages.niveau) => Object.values(JEUX).filter(j => j.niveau === niv);

/* =====================================================================
   10. DIFFICULTÉ ADAPTATIVE
   3 bonnes réponses d'affilée = palier suivant ; 2 erreurs = palier précédent
   ===================================================================== */
function palierMax(jeu) {
  let m = 0;
  jeu.paliers.forEach((p, i) => { if ((p.periode || 1) <= etat.reglages.periode) m = i; });
  return m;
}
function etatPalier(jeu) {
  const s = etat.paliers[jeu.competence] || (etat.paliers[jeu.competence] = { p:0, bonnes:0, erreurs:0 });
  if (s.p > palierMax(jeu)) s.p = palierMax(jeu);
  return s;
}
function adapter(jeu, type) {
  const s = etatPalier(jeu);
  if (type === 'bonne') {
    s.erreurs = 0; s.bonnes++;
    if (s.bonnes >= 3) { s.bonnes = 0; if (s.p < palierMax(jeu)) { s.p++; return true; } }
  } else if (type === 'aidee') {
    s.bonnes = 0;
  } else if (type === 'erreur') {
    s.bonnes = 0; s.erreurs++;
    if (s.erreurs >= 2) { s.erreurs = 0; if (s.p > 0) s.p--; }
  }
  return false;
}

/* =====================================================================
   11. STATISTIQUES (pour l'espace parent)
   ===================================================================== */
function jourStats() {
  const k = aujourdhui();
  return etat.stats.jours[k] || (etat.stats.jours[k] = { secondes:0, series:0, questions:0 });
}
function enregistrerResultat(jeu, reussiDuPremierCoup) {
  const c = etat.stats.competences[jeu.competence] || (etat.stats.competences[jeu.competence] = { essais:0, reussites:0, historique:[] });
  c.essais++; if (reussiDuPremierCoup) c.reussites++;
  c.historique.push(reussiDuPremierCoup ? 1 : 0);
  if (c.historique.length > 20) c.historique.shift();
  jourStats().questions++;
}
/* Pastille : vert ≥ 80 %, orange ≥ 60 %, rouge en dessous (sur les 20 dernières questions) */
function bilanCompetence(id) {
  const c = etat.stats.competences[id];
  if (!c || c.historique.length < 5) return { couleur:'gris', taux:null };
  const taux = Math.round(100 * c.historique.reduce((a, b) => a + b, 0) / c.historique.length);
  return { couleur: taux >= 80 ? 'vert' : taux >= 60 ? 'orange' : 'rouge', taux };
}
function estMaitrisee(jeu) {
  const s = etat.paliers[jeu.competence], b = bilanCompetence(jeu.competence);
  const c = etat.stats.competences[jeu.competence];
  return !!s && s.p >= jeu.paliers.length - 1 && c && c.historique.length >= 10 && b.taux >= 80;
}
/* Temps de jeu : compté toutes les 5 secondes pendant qu'il joue */
setInterval(() => {
  if (document.visibilityState === 'visible' && ['ecran-jeu', 'ecran-medaille', 'ecran-pause'].includes(ecranCourant)) {
    jourStats().secondes += 5;
  }
}, 5000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { sauver(); Voix.taire(); } });

/* =====================================================================
   12. SÉANCE : séries de 5, pause toutes les 3 séries, 15 minutes maximum
   ===================================================================== */
const seance = { debut:null, fin:null, series:0, medailles:0, pauseDue:false };
function demarrerSeanceSiBesoin() {
  if (!seance.debut) {
    seance.debut = Date.now();
    seance.fin = seance.debut + etat.reglages.dureeSeance * 60000;
    seance.series = 0; seance.medailles = 0; seance.pauseDue = false;
  }
}
function terminerSeance() { seance.debut = null; seance.fin = null; }

/* Choix du jeu suivant : jamais deux fois de suite le même, priorités du parent favorisées */
function jeuSuivant() {
  const tous = jeuxDuNiveau();
  let candidats = tous.filter(j => j.id !== etat.dernierJeu);
  if (!candidats.length) candidats = tous;
  const sac = [];
  candidats.forEach(j => { const poids = etat.reglages.priorites.includes(j.competence) ? 3 : 1; for (let i = 0; i < poids; i++) sac.push(j.id); });
  return choix(sac);
}

/* =====================================================================
   13. MOTEUR DE JEU : séries, questions, erreurs, indices, solutions
   ===================================================================== */
let serie = null;      // série en cours
let Q = null;          // question en cours
let verrou = false;    // empêche de répondre pendant une animation
let minuteurs = [];
function plusTard(fn, ms) { const t = setTimeout(fn, ms); minuteurs.push(t); return t; }
function annulerMinuteurs() { minuteurs.forEach(clearTimeout); minuteurs = []; }

/* Ce que le moteur offre à chaque jeu */
const api = {
  repondre: v => repondre(v),
  dire: (t, fin) => Voix.dire(t, fin),
  son: n => Sons.jouer(n),
  plusTard,
  consigne: (t, aide) => afficherConsigne(t, aide),
  pave: (conteneur, opts = {}) => { const p = creerPave(conteneur, { ...opts, onValider: v => repondre(v) }); if (Q) Q._pave = p; return p; },
  get verrouille() { return verrou; },
};

function afficherConsigne(texte, aide = false) {
  const c = $('#consigne'); c.textContent = texte; c.classList.toggle('aide', !!aide);
}
/* Un texte peut être une simple chaîne, ou { texte (affiché), voix (lu à voix haute) } */
const texteEtVoix = c => (c && typeof c === 'object') ? c : { texte: c || '', voix: c || '' };
const consigneDe = (jeu, q) => texteEtVoix(jeu.consigne(q));

function lancerJeu(id) {
  if (!JEUX[id]) return;
  Sons.activer();
  if (seance.pauseDue) { seance.pauseDue = false; return montrerPause(() => lancerJeu(id)); }
  demarrerSeanceSiBesoin();
  etat.dernierJeu = id;
  serie = { jeu:id, index:0, erreurs:0, resultats:[], cles:[] };
  const jeu = JEUX[id];
  montrer('ecran-jeu');
  questionSuivante();
}

function majEtoiles() {
  const e = [];
  for (let i = 0; i < CONFIG.questionsParSerie; i++) {
    e.push(svgEtoile(serie.resultats[i] || (i === serie.index ? 'courante' : 'vide')));
  }
  $('#etoiles').innerHTML = e.join('');
}

function questionSuivante() {
  annulerMinuteurs();
  $('#btn-continuer').classList.remove('actif');
  $('#voile-bravo').classList.remove('actif');
  if (serie.index >= CONFIG.questionsParSerie) return finSerie();
  const jeu = JEUX[serie.jeu];
  const pi = etatPalier(jeu).p;
  const p = jeu.paliers[pi];
  // On évite de reposer la même question que juste avant
  let q, n = 0;
  do { q = jeu.generer(p, { index: serie.index, palier: pi }); n++; } while (q.cle && serie.cles.includes(q.cle) && n < 20);
  serie.cles.push(q.cle); if (serie.cles.length > 3) serie.cles.shift();
  q.palier = pi; q.p = p; q.essais = 0;
  const disp = typeof jeu.disposition === 'function' ? jeu.disposition(q) : jeu.disposition;
  $('#zone-jeu').classList.toggle('plein', disp === 'plein');
  $('#reponses').classList.remove('inactif');
  Q = q; verrou = false;
  majEtoiles();
  const scene = $('#scene'), rep = $('#reponses');
  scene.innerHTML = ''; rep.innerHTML = '';
  jeu.afficher(q, scene, rep, api);
  const c = consigneDe(jeu, q);
  afficherConsigne(c.texte);
  Voix.dernier = c.voix;
  if (etat.reglages.lectureAuto) plusTard(() => Voix.dire(c.voix), 250);
}

function repondre(v) {
  if (verrou || !Q) return;
  const jeu = JEUX[serie.jeu];
  const ok = jeu.verifier(Q, v);
  if (ok) {
    verrou = true;
    const premier = Q.essais === 0;
    enregistrerResultat(jeu, premier);
    const monte = adapter(jeu, premier ? 'bonne' : 'aidee');
    serie.resultats.push(premier ? 'parfait' : 'aide');
    serie.index++;
    majEtoiles();
    Sons.jouer('joie');
    if (jeu.bravo) jeu.bravo(Q, api);
    const delai = jeu.delaiBravo || 500;
    plusTard(() => montrerBravo(monte), delai);
    plusTard(() => questionSuivante(), delai + 1900);
    sauver();
  } else {
    Q.essais++; serie.erreurs++;
    adapter(jeu, 'erreur');
    Sons.jouer('oups');
    if (Q._pave) Q._pave.vider();
    if (Q.essais < 2) {
      const msg = choix(MESSAGES.encore);
      const ind = texteEtVoix(jeu.indice ? jeu.indice(Q, api, v) : '');
      afficherConsigne(ind.texte ? msg + ' ' + ind.texte : msg, true);
      Voix.dire(ind.voix ? msg + ' ' + ind.voix : msg);
    } else {
      // 2e erreur : on montre la solution en l'expliquant
      verrou = true;
      enregistrerResultat(jeu, false);
      serie.resultats.push('solution'); serie.index++;
      majEtoiles();
      const expl = texteEtVoix(jeu.solution(Q, api));
      afficherConsigne(expl.texte);
      Voix.dire(expl.voix);
      $('#reponses').classList.add('inactif');
      $('#btn-continuer').classList.add('actif');
      sauver();
    }
  }
}

function montrerBravo(monte) {
  const fig = choix(RECOMPENSES.figures.filter(estDebloque)).id;
  const prenom = etat.profil.prenom;
  const txt = choix(MESSAGES.bravo);
  $('#bravo-gym').innerHTML = svgGymnaste();
  $('#bravo-texte').textContent = (Math.random() < 0.35 && prenom) ? txt.replace(' !', ', ' + prenom + ' !') : txt;
  $('#bravo-sous').textContent = monte ? MESSAGES.monte : '';
  $('#voile-bravo').classList.add('actif');
  const g = $('#bravo-gym .anime');
  if (g) g.classList.add('fig-' + fig);
  if (fig === 'saut' || fig === 'salto' || fig === 'vrille') Sons.jouer('boing');
}

function finSerie() {
  const jeu = JEUX[serie.jeu];
  const type = serie.erreurs === 0 ? 'or' : serie.erreurs <= 2 ? 'argent' : 'bronze';
  const avant = pointsMedailles();
  etat.medailles.push({ jeu: jeu.id, type, date: aujourdhui() });
  const apres = pointsMedailles();
  const nouveautes = [...RECOMPENSES.tenues, ...RECOMPENSES.accessoires, ...RECOMPENSES.figures].filter(r => r.points > avant && r.points <= apres);
  etat.stats.jeux[jeu.id] = (etat.stats.jeux[jeu.id] || 0) + 1;
  jourStats().series++;
  seance.series++; seance.medailles++;
  if (etat.reglages.pauses && seance.series % CONFIG.seriesAvantPause === 0) seance.pauseDue = true;
  sauver();
  // Écran de la médaille
  $('#medaille-svg').innerHTML = svgMedaille(type, 'medaille-grande');
  $('#medaille-titre').textContent = MESSAGES.medaille[type];
  $('#medaille-texte').textContent = MESSAGES.medailleTexte[type];
  const nv = $('#medaille-nouveau');
  if (nouveautes.length) { nv.style.display = ''; nv.textContent = 'Nouveau ! Tu débloques : ' + nouveautes.map(r => r.nom.toLowerCase()).join(', ') + ' !'; }
  else nv.style.display = 'none';
  montrer('ecran-medaille');
  Sons.jouer('fanfare'); Sons.jouer('applaudissements');
  Voix.dire(MESSAGES.medaille[type] + ' ' + (nouveautes.length ? 'Tu as un nouveau cadeau dans ta vitrine !' : MESSAGES.medailleTexte[type]));
}

/* Après la médaille : fin de séance ? pause ? jeu suivant ? */
function apresSerie(suite) {
  Voix.taire();
  if (seance.fin && Date.now() >= seance.fin) return montrerFinSeance();
  if (suite === 'suivant') lancerJeu(jeuSuivant());
  else allerAccueil();
}

/* Pause échauffement avec compte à rebours visuel */
let pauseMinuteur = null;
function montrerPause(ensuite) {
  const exo = choix(PAUSES_ECHAUFFEMENT);
  $('#pause-gym').innerHTML = svgGymnaste(etat.profil, 'pause-gym');
  $('#pause-texte').textContent = exo.texte;
  montrer('ecran-pause');
  Voix.dire('Pause échauffement ! ' + exo.texte);
  const total = CONFIG.dureePauseSecondes, anneau = $('#pause-anneau'), nb = $('#pause-nombre');
  let reste = total;
  const maj = () => { nb.textContent = reste; anneau.setAttribute('stroke-dashoffset', (314.16 * (1 - reste / total)).toFixed(1)); };
  maj();
  clearInterval(pauseMinuteur);
  pauseMinuteur = setInterval(() => {
    reste--; maj();
    if (reste <= 0) { clearInterval(pauseMinuteur); Sons.jouer('joie'); Voix.dire('Bravo ! On repart ?'); }
  }, 1000);
  $('#pause-fini').onclick = () => { clearInterval(pauseMinuteur); Voix.taire(); ensuite(); };
}

/* Fin de séance : message positif */
function montrerFinSeance() {
  const p = etat.profil.prenom || 'champion';
  $('#fin-gym').innerHTML = svgGymnaste(etat.profil, 'medaille-grande');
  $('#fin-titre').textContent = `Super séance, ${p} !`;
  $('#fin-texte').textContent = `Tu as gagné ${seance.medailles} médaille${seance.medailles > 1 ? 's' : ''} aujourd’hui. Ton gymnaste a besoin de repos. À demain au gymnase !`;
  montrer('ecran-fin');
  Sons.jouer('applaudissements');
  Voix.dire(`Super séance ${p} ! Ton gymnaste a besoin de repos. À demain au gymnase !`);
}

/* ---------------------------------------------------------------------
   JEU 1 — TAPIS DE COMPTAGE (le tapis)
   Les objets apparaissent un par un. Il peut les toucher pour compter,
   puis tape le nombre sur le pavé.
   --------------------------------------------------------------------- */
enregistrerJeu({
  id:'comptage', nom:'Tapis de comptage', niveau:'CP', matiere:'maths', agres:'tapis', competence:'cp-denombrer',
  disposition:'deux',
  paliers: [
    { nom:'Compter jusqu’à 5',                        periode:1, min:1,  max:5,   dispo:'ligne' },
    { nom:'Compter jusqu’à 10 (objets bien rangés)',  periode:1, min:4,  max:10,  dispo:'cadre' },
    { nom:'Compter jusqu’à 10 (objets en vrac)',      periode:1, min:5,  max:10,  dispo:'vrac' },
    { nom:'Compter jusqu’à 20',                       periode:2, min:11, max:20,  dispo:'cadres' },
    { nom:'Compter jusqu’à 60 avec des barres de 10', periode:3, min:20, max:60,  dispo:'dizaines' },
    { nom:'Compter jusqu’à 100 avec des barres de 10',periode:4, min:40, max:100, dispo:'dizaines' },
  ],
  generer(p) {
    const n = rnd(p.min, p.max);
    return { n, objet: choix(OBJETS_GYM), dispo: p.dispo, cle: 'n' + n };
  },
  consigne: () => 'Combien y en a-t-il ?',
  /* Calcule la place de chaque objet sur le tapis (repère 600 × 400) */
  placer(q) {
    const it = [], n = q.n;
    if (q.dispo === 'ligne') {
      for (let i = 0; i < n; i++) it.push({ x: 300 - (n - 1) * 55 + i * 110, y: 200, t: 90, v: 1 });
    } else if (q.dispo === 'cadre') {
      for (let i = 0; i < n; i++) it.push({ x: 92 + (i % 5) * 104, y: 140 + Math.floor(i / 5) * 120, t: 76, v: 1, cadre: true });
    } else if (q.dispo === 'vrac') {
      const cases = melanger([...Array(15).keys()]).slice(0, n);
      cases.forEach(c => it.push({ x: 80 + (c % 5) * 110 + rnd(-16, 16), y: 75 + Math.floor(c / 5) * 125 + rnd(-14, 14), t: 80, v: 1 }));
    } else if (q.dispo === 'cadres') {
      for (let i = 0; i < n; i++) { const r = Math.floor(i / 5); it.push({ x: 92 + (i % 5) * 104, y: 61 + r * 82 + (r >= 2 ? 22 : 0), t: 62, v: 1, cadre: true }); }
    } else { // dizaines : barres de 10 cubes et cubes isolés
      const d = Math.floor(n / 10), u = n % 10;
      for (let i = 0; i < d; i++) it.push({ x: 30 + i * 46, y: 50, barre: true, v: 10 });
      for (let i = 0; i < u; i++) it.push({ x: 30 + d * 46 + 22, y: 320 - i * 30, cube: true, v: 1 });
    }
    return it;
  },
  afficher(q, scene, rep, api) {
    const items = this.placer(q);
    q.items = items; q.compte = 0;
    let svg = `<svg class="svg-scene" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet"><rect x="4" y="4" width="592" height="392" rx="26" fill="#E3ECF8"/>`;
    items.forEach((it, i) => {
      let forme;
      if (it.barre) forme = `<rect x="${it.x}" y="${it.y}" width="36" height="300" rx="6" fill="#2F6FD0" stroke="#1D4E89" stroke-width="3"/>` +
        [...Array(9).keys()].map(k => `<line x1="${it.x}" y1="${it.y + 30 * (k + 1)}" x2="${it.x + 36}" y2="${it.y + 30 * (k + 1)}" stroke="#1D4E89" stroke-width="2"/>`).join('');
      else if (it.cube) forme = `<rect x="${it.x}" y="${it.y}" width="36" height="28" rx="5" fill="#EF8A17" stroke="#B35F0B" stroke-width="3"/>`;
      else forme = (it.cadre ? `<rect x="${it.x - 50}" y="${it.y - (it.t > 70 ? 58 : 39)}" width="100" height="${it.t > 70 ? 116 : 78}" fill="#fff" stroke="#9FB6D6" stroke-width="2"/>` : '')
        + svgObjet(q.objet, it.x, it.y, it.t * 0.95) + `<rect x="${it.x - it.t / 2}" y="${it.y - it.t / 2}" width="${it.t}" height="${it.t}" fill="transparent"/>`;
      svg += `<g class="objet" data-i="${i}" style="opacity:0;cursor:pointer">${forme}<g class="etiq"></g></g>`;
    });
    svg += `</svg>`;
    scene.innerHTML = `<div class="scene-col">${svg}</div><button class="btn-mini coin" id="recompter">${ICONES.recommencer} Recompter</button>`;
    // Apparition un par un (avant la réflexion, puis plus rien ne bouge)
    const gs = $$('.objet', scene);
    const delai = q.n > 20 ? 120 : 330;
    gs.forEach((g, i) => api.plusTard(() => { g.style.opacity = 1; api.son('tic'); }, 200 + i * delai));
    // Compter en touchant les objets (manipulation)
    gs.forEach((g, i) => g.addEventListener('click', () => {
      if (g.dataset.compte) return;
      q.compte += items[i].v;
      g.dataset.compte = '1';
      this.etiquette(g, items[i], q.compte);
      api.dire(String(q.compte));
    }));
    $('#recompter', scene).addEventListener('click', () => this.effacerEtiquettes(q, scene));
    api.pave(rep, { max: 3 });
  },
  etiquette(g, it, num, couleur = '#D9620F') {
    let x, y;
    if (it.barre) { x = it.x + 18; y = it.y - 18; }
    else if (it.cube) { x = it.x + 58; y = it.y + 14; }
    else { x = it.x + it.t * 0.38; y = it.y - it.t * 0.38; }
    $('.etiq', g).innerHTML = `<circle cx="${x}" cy="${y}" r="17" fill="${couleur}"/><text x="${x}" y="${y + 1}" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">${num}</text>`;
  },
  effacerEtiquettes(q, scene) {
    q.compte = 0;
    $$('.objet', scene).forEach(g => { delete g.dataset.compte; $('.etiq', g).innerHTML = ''; });
  },
  verifier: (q, v) => Number(v) === q.n,
  indice(q) {
    const scene = $('#scene');
    this.effacerEtiquettes(q, scene);
    if (q.dispo === 'dizaines') {
      // repère : 10 sur chaque barre
      $$('.objet', scene).forEach((g, i) => { if (q.items[i].barre) this.etiquette(g, q.items[i], 10, '#1D4E89'); });
      return 'Une barre, c’est 10. Compte les barres : 10, 20, 30…';
    }
    // repères tous les 5 objets
    let total = 0;
    $$('.objet', scene).forEach((g, i) => { total++; if (total % 5 === 0) this.etiquette(g, q.items[i], total, '#1D4E89'); });
    return 'Touche chaque objet en comptant.';
  },
  solution(q) {
    const scene = $('#scene');
    this.effacerEtiquettes(q, scene);
    let total = 0;
    $$('.objet', scene).forEach((g, i) => { g.style.opacity = 1; total += q.items[i].v; this.etiquette(g, q.items[i], total, '#23804D'); });
    if (q.dispo === 'dizaines') {
      const d = Math.floor(q.n / 10), u = q.n % 10;
      return `Il y en a ${q.n} : ${d} barre${d > 1 ? 's' : ''} de 10 et ${u} cube${u > 1 ? 's' : ''}.`;
    }
    return `Il y en a ${q.n}. Regarde, on compte jusqu’à ${q.n}.`;
  },
});

/* ---------------------------------------------------------------------
   JEU 2 — TRAMPOLINE DES ADDITIONS (le trampoline)
   Le gymnaste part du 1er nombre et fait un rebond par unité ajoutée.
   --------------------------------------------------------------------- */
enregistrerJeu({
  id:'trampoline', nom:'Trampoline des additions', niveau:'CP', matiere:'maths', agres:'trampoline', competence:'cp-addition',
  disposition:'deux',
  paliers: [
    { nom:'Ajouter 1 ou 2 (résultat jusqu’à 5), avec rebonds', periode:1, max:10, somme:5,  bMax:2, ligne:true },
    { nom:'Additions jusqu’à 10, avec rebonds',               periode:1, max:10, somme:10, bMax:3, ligne:true },
    { nom:'Ajouter jusqu’à 5 (résultat jusqu’à 10), avec la ligne', periode:1, max:10, somme:10, bMax:5, ligne:true },
    { nom:'Additions jusqu’à 10 de tête',                     periode:2, max:10, somme:10, bMax:5, ligne:false },
    { nom:'Les doubles (1+1 … 10+10) de tête',                periode:2, max:20, doubles:true, ligne:false },
    { nom:'Additions jusqu’à 20 de tête',                     periode:3, max:20, somme:20, bMax:9, ligne:false },
  ],
  generer(p) {
    let a, b;
    if (p.doubles) { a = rnd(1, 10); b = a; }
    else { b = rnd(1, p.bMax); a = rnd(1, Math.max(1, p.somme - b)); }
    return { a, b, s: a + b, max: p.max, ligne: p.ligne, cle: a + '+' + b };
  },
  consigne: q => ({ texte: 'Combien ça fait ?', voix: `${q.a} plus ${q.b}, combien ça fait ?` }),
  x(q, k) { return 40 + k * (580 / q.max); },
  afficher(q, scene, rep, api) {
    q.pos = q.a; q.bonds = 0; q.anim = false;
    let ticks = '';
    for (let k = 0; k <= q.max; k++) {
      const x = this.x(q, k), gros = q.max <= 10 || k % 5 === 0;
      ticks += `<line x1="${x}" y1="150" x2="${x}" y2="${gros ? 170 : 162}" stroke="#1F2A44" stroke-width="3"/>`;
      if (q.max <= 10 || k % 2 === 0) ticks += `<text x="${x}" y="198" font-size="${q.max <= 10 ? 28 : 22}" font-weight="700" text-anchor="middle" fill="${k === q.a ? '#D9620F' : '#1F2A44'}">${k}</text>`;
    }
    const svg = `<svg class="svg-scene" id="ligne-num" viewBox="0 0 660 210" preserveAspectRatio="xMidYMid meet" style="overflow:visible;${q.ligne ? '' : 'display:none'}">
      <line x1="30" y1="150" x2="630" y2="150" stroke="#1F2A44" stroke-width="4" stroke-linecap="round"/>${ticks}
      <g id="traces"></g>
      <g id="mini" transform="translate(${this.x(q, q.a)},150)"><svg x="-32" y="-92" width="64" height="90" viewBox="0 0 120 170">${svgGymnaste().replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg></g>
    </svg>`;
    const deco = q.ligne ? '' : `<div id="deco-trampo" style="width:min(40%,220px)">${svgAgres('trampoline')}</div>`;
    scene.innerHTML = `<div class="scene-col">
      <div class="calcul">${q.a} + ${q.b} = <span class="trou" id="trou">?</span></div>
      ${deco}${svg}
      <div class="rangee" id="ctrl-rebond" style="${q.ligne ? '' : 'display:none'};align-items:center">
        <button class="btn orange" id="btn-rebond">Rebondir</button>
        <span id="nb-bonds" style="font-size:var(--texte);font-weight:700;min-width:5em;text-align:center">0 bond</span>
        <button class="btn-mini" id="btn-depart" aria-label="Recommencer">${ICONES.recommencer}</button>
      </div></div>`;
    $('#btn-rebond', scene).addEventListener('click', () => this.rebondir(q, api));
    $('#btn-depart', scene).addEventListener('click', () => this.auDepart(q));
    api.pave(rep, { max: 2 });
  },
  auDepart(q) {
    q.pos = q.a; q.bonds = 0;
    $('#traces').innerHTML = '';
    $('#mini').setAttribute('transform', `translate(${this.x(q, q.a)},150)`);
    $('#nb-bonds').textContent = '0 bond';
  },
  /* Un rebond = avancer de 1 sur la ligne (animation déclenchée par l'enfant) */
  rebondir(q, api, fin) {
    if (q.anim || q.pos >= q.max) { fin && fin(); return; }
    q.anim = true;
    const x0 = this.x(q, q.pos), x1 = this.x(q, q.pos + 1), mini = $('#mini');
    api.son('boing');
    const t0 = performance.now(), duree = 380;
    const etape = t => {
      const k = Math.min(1, (t - t0) / duree);
      const x = x0 + (x1 - x0) * k, y = 150 - Math.sin(Math.PI * k) * 55;
      if (mini) mini.setAttribute('transform', `translate(${x},${y})`);
      if (k < 1) requestAnimationFrame(etape);
      else {
        q.pos++; q.bonds++; q.anim = false;
        const tr = $('#traces');
        if (tr) tr.insertAdjacentHTML('beforeend', `<path d="M${x0} 146 Q${(x0 + x1) / 2} 96 ${x1} 146" stroke="#D9620F" stroke-width="3" fill="none" stroke-dasharray="6 5"/>`);
        const nb = $('#nb-bonds'); if (nb) nb.textContent = q.bonds + (q.bonds > 1 ? ' bonds' : ' bond');
        fin && fin();
      }
    };
    requestAnimationFrame(etape);
  },
  montrerLigne() {
    const l = $('#ligne-num'), c = $('#ctrl-rebond'), d = $('#deco-trampo');
    if (l) l.style.display = ''; if (c) c.style.display = 'flex'; if (d) d.style.display = 'none';
  },
  verifier: (q, v) => Number(v) === q.s,
  indice(q) {
    this.montrerLigne(); this.auDepart(q);
    return `Pars de ${q.a} et fais ${q.b} rebond${q.b > 1 ? 's' : ''}.`;
  },
  solution(q, api) {
    this.montrerLigne(); this.auDepart(q);
    const r = $('#ctrl-rebond'); if (r) r.style.display = 'none';
    let n = 0;
    const suite = () => { if (n++ < q.b) api.plusTard(() => this.rebondir(q, api, suite), 150); else { const t = $('#trou'); if (t) { t.textContent = q.s; t.classList.add('rempli'); } } };
    api.plusTard(suite, 400);
    const etapes = [...Array(q.b).keys()].map(i => q.a + i + 1).join(', ');
    return `${q.a} + ${q.b} = ${q.s}. On part de ${q.a} et on avance : ${etapes}.`;
  },
  bravo(q) { const t = $('#trou'); if (t) { t.textContent = q.s; t.classList.add('rempli'); } },
});

/* ---------------------------------------------------------------------
   JEU 3 — MAISON DES NOMBRES (le plinth)
   Le plinth porte un nombre ; chaque étage est une façon de le décomposer.
   Pendant la série, la maison se remplit de toutes les décompositions.
   --------------------------------------------------------------------- */
enregistrerJeu({
  id:'maison', nom:'Maison des nombres', niveau:'CP', matiere:'maths', agres:'plinthe', competence:'cp-decomposer',
  disposition:'deux',
  paliers: [
    { nom:'Décomposer 3, 4 et 5 avec des jetons', periode:1, min:3, max:5,  jetons:'gris', zero:false },
    { nom:'Décomposer jusqu’à 7 avec des jetons', periode:1, min:5, max:7,  jetons:'gris', zero:false },
    { nom:'Décomposer jusqu’à 10 en retournant des jetons', periode:1, min:6, max:10, jetons:'tous', zero:true },
    { nom:'Décomposer jusqu’à 10 de tête',        periode:2, min:6, max:10, jetons:'non', zero:true },
    { nom:'Les compléments à 10',                  periode:2, min:10, max:10, jetons:'non', zero:true },
    { nom:'Décomposer jusqu’à 20 (10 et encore…)', periode:3, min:11, max:20, jetons:'non', zero:false, dix:true },
  ],
  memoire: null, // nombre de la maison en cours et étages déjà faits
  generer(p, ctx) {
    let m = this.memoire;
    const possibles = N => { const r = []; for (let a = (p.zero ? 0 : 1); a <= N - (p.zero ? 0 : 1); a++) r.push(a); return r; };
    if (ctx.index === 0 || !m || m.N < p.min || m.N > p.max || !possibles(m.N).some(a => !m.faits.includes(a))) {
      m = this.memoire = { N: rnd(p.min, p.max), faits: [] };
    }
    let libres = possibles(m.N).filter(a => !m.faits.includes(a));
    let a = choix(libres);
    if (p.dix && !m.faits.includes(10) && Math.random() < 0.5) a = 10;
    const etages = m.faits.slice(-4).map(x => [x, m.N - x]);
    m.faits.push(a);
    const cache = ctx.palier === 0 ? 'droite' : choix(['gauche', 'droite']);
    return { N: m.N, a, b: m.N - a, cache, etages, jetons: p.jetons, cle: m.N + ':' + a };
  },
  consigne: q => ({ texte: `Complète la maison du ${q.N}.`, voix: q.cache === 'droite' ? `${q.N}, c’est ${q.a} et combien ?` : `${q.N}, c’est combien et ${q.b} ?` }),
  connu: q => q.cache === 'droite' ? q.a : q.b,
  manque: q => q.cache === 'droite' ? q.b : q.a,
  jetonsHTML(q, mode) {
    const connu = this.connu(q);
    let h = '';
    for (let i = 0; i < q.N; i++) {
      if (mode === 'tous') h += `<button class="jeton neutre" data-i="${i}" aria-label="jeton"></button>`;
      else if (mode === 'solution') h += `<div class="jeton ${i < connu ? '' : 'solution'}"></div>`;
      else h += `<div class="jeton ${i < connu ? '' : 'inconnu'}"></div>`;
    }
    return h;
  },
  afficher(q, scene, rep, api) {
    const etages = q.etages.map(([x, y]) => `<div class="etage"><span>${x}</span><span>${y}</span></div>`).join('');
    const g = q.cache === 'gauche' ? `<span class="trou" id="trou">?</span>` : `<span>${q.a}</span>`;
    const d = q.cache === 'droite' ? `<span class="trou" id="trou">?</span>` : `<span>${q.b}</span>`;
    scene.innerHTML = `<div class="maison-scene">

    </div>`;
    // Jetons à retourner (manipulation) : il retourne ceux qu'il connaît, puis compte les autres
    $$('.jeton.neutre', scene).forEach(j => j.addEventListener('click', () => { j.classList.toggle('retourne'); api.son('clic'); }));
    api.pave(rep, { max: 2 });
  },
  verifier(q, v) { return Number(v) === this.manque(q); },
  indice(q) {
    const j = $('#jetons');
    j.style.display = ''; j.innerHTML = this.jetonsHTML(q, 'gris');
    return `Compte les jetons orange.`;
  },
