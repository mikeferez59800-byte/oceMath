    j.style.display = ''; j.innerHTML = this.jetonsHTML(q, 'solution');
    const t = $('#trou'); t.textContent = this.manque(q); t.classList.add('rempli');
    return `${q.N}, c’est ${q.a} et encore ${q.b}.`;
  },
  bravo(q) { const t = $('#trou'); if (t) { t.textContent = this.manque(q); t.classList.add('rempli'); } },
});

/* ---------------------------------------------------------------------
   JEU 4 — POUTRE D'ÉQUILIBRE (la poutre)
   Deux quantités ou deux nombres : où y en a-t-il le plus ? La poutre penche.
   --------------------------------------------------------------------- */
enregistrerJeu({
  id:'poutre', nom:'Poutre d’équilibre', niveau:'CP', matiere:'maths', agres:'poutre', competence:'cp-comparer',
  disposition: q => q.mode === 'signes' ? 'deux' : 'plein',   // « le plus / le moins » : on touche directement la poutre
  paliers: [
    { nom:'Où y en a-t-il le plus ? (jusqu’à 5)',      periode:1, mode:'plus',   min:1, max:5,  egal:false, vrac:false },
    { nom:'Le plus, ou pareil ? (jusqu’à 10)',         periode:1, mode:'plus',   min:1, max:10, egal:true,  vrac:true },
    { nom:'Où y en a-t-il le moins ? (jusqu’à 10)',     periode:1, mode:'moins',  min:1, max:10, egal:true,  vrac:true },
    { nom:'Comparer deux nombres jusqu’à 20 (<, >, =)', periode:2, mode:'signes', min:0, max:20 },
    { nom:'Comparer deux nombres jusqu’à 60',           periode:3, mode:'signes', min:10, max:60 },
    { nom:'Comparer deux nombres jusqu’à 100',          periode:4, mode:'signes', min:10, max:100 },
  ],
  generer(p) {
    let g = rnd(p.min, p.max), d = rnd(p.min, p.max);
    if (p.mode === 'signes' || p.egal) { if (Math.random() < 0.2) d = g; }
    else while (d === g) d = rnd(p.min, p.max);
    if (p.mode === 'signes' && d !== g && Math.random() < 0.4 && p.max > 20) { // nombres « pièges » : mêmes chiffres inversés ou même dizaine
      const dz = Math.floor(g / 10); d = Math.min(p.max, dz * 10 + rnd(0, 9)); if (d === g) d = Math.max(p.min, g - 1);
    }
    return { g, d, mode: p.mode, egal: !!p.egal, vrac: !!p.vrac, objet: choix(OBJETS_GYM), cle: g + '/' + d };
  },
  consigne(q) {
    if (q.mode === 'plus') { const t = q.egal ? 'Où y en a-t-il le plus ? Ou c’est pareil ?' : 'Où y en a-t-il le plus ?'; return { texte: t, voix: t + ' Touche le bon côté.' }; }
    if (q.mode === 'moins') return { texte: 'Où y en a-t-il le moins ? Ou c’est pareil ?', voix: 'Où y en a-t-il le moins ? Touche le bon côté, ou pareil.' };
    return { texte: 'Choisis le bon signe.', voix: `Compare ${q.g} et ${q.d}. Choisis le bon signe.` };
  },
  bonne(q) {
    if (q.mode === 'signes') return q.g < q.d ? '<' : q.g > q.d ? '>' : '=';
    if (q.g === q.d) return '=';
    if (q.mode === 'plus') return q.g > q.d ? 'g' : 'd';
    return q.g < q.d ? 'g' : 'd';
  },
  /* Positions des objets d'un côté (rangés ou en vrac) */
  positions(n, cx, vrac) {
    const pos = [];
    if (vrac) {
      const cases = melanger([...Array(15).keys()]).slice(0, n);
      cases.forEach(c => pos.push([cx - 96 + (c % 5) * 48 + rnd(-5, 5), 58 + Math.floor(c / 5) * 52 + rnd(-5, 5)]));
    } else {
      for (let i = 0; i < n; i++) pos.push([cx - 96 + (i % 5) * 48, 174 - Math.floor(i / 5) * 52]);
    }
    return pos;
  },
  cote(q, n, cx, vrac) {
    if (q.mode === 'signes') return `<text x="${cx}" y="128" font-size="96" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#1F2A44">${n}</text>`;
    return this.positions(n, cx, vrac).map(([x, y]) => svgObjet(q.objet, x, y, 44)).join('');
  },
  afficher(q, scene, rep, api) {
    const zones = q.mode === 'signes' ? '' :
      `<rect class="zone-cote" data-c="g" x="8" y="8" width="300" height="330" rx="22" fill="#E3ECF8" style="cursor:pointer"/>
       <rect class="zone-cote" data-c="d" x="332" y="8" width="300" height="330" rx="22" fill="#E3ECF8" style="cursor:pointer"/>`;
    scene.innerHTML = `<div class="scene-col"><svg class="svg-scene" viewBox="0 0 640 380" preserveAspectRatio="xMidYMid meet">
      ${zones}
      <polygon points="300,370 340,370 330,224 310,224" fill="#56607A"/>
      <rect x="250" y="362" width="140" height="12" rx="6" fill="#56607A"/>
      <g id="fleau" style="transform-origin:320px 214px;transition:transform .7s ease-out">
        <rect x="40" y="204" width="560" height="20" rx="10" fill="#C98B4A"/>
        <g id="cote-g" style="pointer-events:none">${this.cote(q, q.g, 175, q.vrac)}</g>
        <g id="cote-d" style="pointer-events:none">${this.cote(q, q.d, 465, q.vrac)}</g>
        ${q.mode === 'signes' ? `<circle cx="320" cy="128" r="46" fill="#fff" stroke="#D9620F" stroke-width="5" stroke-dasharray="10 7"/><text id="signe" x="320" y="130" font-size="64" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#D9620F">?</text>` : ''}
      </g>
      <g id="comptes"></g>
    </svg>${q.mode !== 'signes' && q.egal ? `<button class="btn-choix" data-r="=" style="font-size:clamp(28px,5vmin,48px)">= Pareil</button>` : ''}</div>`;
    if (q.mode === 'signes') {
      rep.innerHTML = `<div class="choix-grille">
        <button class="btn-choix" data-r="<">&lt;<span class="petit">plus petit que</span></button>
        <button class="btn-choix" data-r="=">=<span class="petit">égal à</span></button>
        <button class="btn-choix" data-r=">">&gt;<span class="petit">plus grand que</span></button></div>`;
    } else {
      $$('[data-r]', scene).forEach(b => b.addEventListener('click', () => api.repondre(b.dataset.r)));
      $$('.zone-cote', scene).forEach(z => z.addEventListener('click', () => api.repondre(z.dataset.c)));
    }
    $$('[data-r]', rep).forEach(b => b.addEventListener('click', () => api.repondre(b.dataset.r)));
  },
  verifier(q, v) { return v === this.bonne(q); },
  pencher(q) {
    const f = $('#fleau'); if (!f) return;
    f.style.transform = q.g > q.d ? 'rotate(-7deg)' : q.g < q.d ? 'rotate(7deg)' : 'rotate(0deg)';
  },
  montrerComptes(q) {
    if (q.mode === 'signes') return;
    $('#comptes').innerHTML = `<text x="175" y="262" font-size="40" font-weight="700" text-anchor="middle" fill="#23804D">${q.g}</text><text x="465" y="262" font-size="40" font-weight="700" text-anchor="middle" fill="#23804D">${q.d}</text>`;
  },
  indice(q, api, v) {
    if (q.mode === 'signes') {
      if (Math.max(q.g, q.d) >= 10) return 'Regarde d’abord les dizaines.';
      return 'Le bec du signe s’ouvre vers le plus grand.';
    }
    // on range les objets en lignes pour comparer un à un
    $('#cote-g').innerHTML = this.cote(q, q.g, 175, false);
    $('#cote-d').innerHTML = this.cote(q, q.d, 465, false);
    return 'Compte chaque côté.';
  },
  solution(q) {
    this.montrerComptes(q); this.pencher(q);
    if (q.mode === 'signes') {
      const s = this.bonne(q); $('#signe').textContent = s;
      if (s === '=') return `${q.g} et ${q.d}, c’est pareil : ${q.g} = ${q.d}.`;
      return s === '<' ? `${q.g} est plus petit que ${q.d}, donc ${q.g} < ${q.d}.` : `${q.g} est plus grand que ${q.d}, donc ${q.g} > ${q.d}.`;
    }
    if (q.g === q.d) return `Il y en a ${q.g} de chaque côté : c’est pareil !`;
    const grand = Math.max(q.g, q.d), petit = Math.min(q.g, q.d);
    return q.mode === 'plus' ? `${grand}, c’est plus que ${petit}. La poutre penche de ce côté.` : `${petit}, c’est moins que ${grand}.`;
  },
  bravo(q) {
    this.montrerComptes(q); this.pencher(q);
    if (q.mode === 'signes') $('#signe').textContent = this.bonne(q);
  },
  delaiBravo: 900,
});

/* ---------------------------------------------------------------------
   Outils pour les jeux de syllabes : uniquement les sons « vus en classe »
   --------------------------------------------------------------------- */
function sonsVus(type) {
  return SONS.filter(s => s.type === type && s.syllabes !== false && etat.reglages.sonsVus.includes(s.g));
}
/* Syllabes consonne + voyelle (ma, li, rou…) */
function syllabesCV() {
  let cs = sonsVus('consonne'), vs = sonsVus('voyelle');
  if (!cs.length) cs = SONS.filter(s => ['l', 'm'].includes(s.g));        // sécurité si rien n'est coché
  if (vs.length < 2) vs = SONS.filter(s => ['a', 'i', 'o'].includes(s.g));
  const r = [];
  cs.forEach(c => vs.forEach(v => { if (!(c.pasAvec || []).includes(v.g)) r.push({ c: c.g, v: v.g, txt: c.g + v.g }); }));
  return r;
}
/* Syllabes inverses voyelle + consonne (al, or, us…) : seulement avec les consonnes qui « chantent » */
function syllabesVC() {
  const cs = sonsVus('consonne').filter(s => ['l', 'r', 'm', 's', 'f', 'n'].includes(s.g));
  const vs = sonsVus('voyelle').filter(s => ['a', 'i', 'o', 'u'].includes(s.g));
  const r = [];
  cs.forEach(c => vs.forEach(v => r.push({ c: c.g, v: v.g, txt: v.g + c.g, inverse: true })));
  return r.length >= 3 ? r : [{ c:'l', v:'a', txt:'al', inverse:true }, { c:'r', v:'o', txt:'or', inverse:true }, { c:'l', v:'i', txt:'il', inverse:true }, { c:'r', v:'u', txt:'ur', inverse:true }];
}
/* Choisit des syllabes « pièges » : loin (rien en commun), proches (une lettre en commun) */
function distracteurs(cible, pool, nb, mode) {
  const autres = pool.filter(s => s.txt !== cible.txt);
  let pref = mode === 'proche' ? autres.filter(s => s.c === cible.c || s.v === cible.v)
           : mode === 'loin' ? autres.filter(s => s.c !== cible.c && s.v !== cible.v) : [];
  let res = melanger(pref).slice(0, nb);
  if (res.length < nb) res = res.concat(melanger(autres.filter(s => !res.includes(s))).slice(0, nb - res.length));
  return res;
}

/* ---------------------------------------------------------------------
   JEU 5 — FUSION DE SYLLABES (le ruban)
   Une consonne + une voyelle = une syllabe. On peut écouter chaque lettre.
   --------------------------------------------------------------------- */
enregistrerJeu({
  id:'fusion', nom:'Fusion de syllabes', niveau:'CP', matiere:'francais', agres:'ruban', competence:'cp-fusion',
  disposition:'deux',
  paliers: [
    { nom:'Assembler 2 sons (2 choix)',                    periode:1, mode:'choix', nb:2, pieges:'loin' },
    { nom:'Assembler 2 sons (3 choix)',                    periode:1, mode:'choix', nb:3, pieges:'loin' },
    { nom:'Assembler 2 sons (choix qui se ressemblent)',   periode:1, mode:'choix', nb:3, pieges:'proche' },
    { nom:'Construire la syllabe entendue',                periode:1, mode:'construire' },
    { nom:'Syllabes à l’envers (a + l = al)',              periode:2, mode:'inverse', nb:3, pieges:'proche' },
  ],
  generer(p) {
    const pool = p.mode === 'inverse' ? syllabesVC() : syllabesCV();
    const cible = choix(pool);
    const q = { mode: p.mode, ...cible, cle: cible.txt };
    if (p.mode === 'construire') {
      const cs = [...new Set(pool.map(s => s.c))], vs = [...new Set(pool.map(s => s.v))];
      q.cOpts = melanger([cible.c, ...melanger(cs.filter(c => c !== cible.c)).slice(0, 2)]);
      q.vOpts = melanger([cible.v, ...melanger(vs.filter(v => v !== cible.v)).slice(0, 2)]);
    } else {
      q.choix = melanger([cible, ...distracteurs(cible, pool, p.nb - 1, p.pieges)]).map(s => s.txt);
    }
    return q;
  },
  premier: q => q.inverse ? q.v : q.c,
  second:  q => q.inverse ? q.c : q.v,
  consigne(q) {
    if (q.mode === 'construire') return { texte: 'Écoute et construis la syllabe.', voix: `Écoute : ${direSyllabe(q.txt)}. Construis la syllabe ${direSyllabe(q.txt)}.` };
    return { texte: 'Quelle syllabe ça fait ?', voix: `${direSon(this.premier(q))}… et… ${direSon(this.second(q))}… Quelle syllabe ça fait ?` };
  },
  afficher(q, scene, rep, api) {
    if (q.mode === 'construire') return this.afficherConstruire(q, scene, rep, api);
    const l1 = this.premier(q), l2 = this.second(q);
    const cls = g => (SONS.find(s => s.g === g) || {}).type === 'voyelle' ? 'voyelle' : '';
    scene.innerHTML = `<div class="fusion" id="fusion">
      <button class="tuile ${cls(l1)}" data-son="${l1}">${l1}<span class="hp">${ICONES.haut}</span></button>
      <span class="op">+</span>
      <button class="tuile ${cls(l2)}" data-son="${l2}">${l2}<span class="hp">${ICONES.haut}</span></button>
      <span class="op">=</span>
      <div class="tuile resultat" id="resultat">?</div></div>`;
    $$('[data-son]', scene).forEach(b => b.addEventListener('click', () => api.dire(direSon(b.dataset.son))));
    rep.innerHTML = `<div class="choix-grille">${q.choix.map(t => `<button class="btn-choix" data-r="${t}">${t}</button>`).join('')}</div>`;
    $$('[data-r]', rep).forEach(b => b.addEventListener('click', () => api.repondre(b.dataset.r)));
  },
  /* Palier « construire » : glisser (ou toucher) la consonne puis la voyelle dans les cases */
  afficherConstruire(q, scene, rep, api) {
    q.place = { c: null, v: null };
    scene.innerHTML = `<div class="scene-col">
      <button class="ecoute-grand" id="ecoute-syl" aria-label="Écouter la syllabe">${ICONES.haut}</button>
      <div class="cases"><div class="case" data-case="c"></div><div class="case" data-case="v"></div></div></div>`;
    $('#ecoute-syl', scene).addEventListener('click', () => api.dire(direSyllabe(q.txt)));
    rep.innerHTML = `<div class="cartes-lettres">
      <div class="rangee">${q.cOpts.map(c => `<div class="carte-lettre" data-type="c" data-l="${c}">${c}</div>`).join('')}</div>
      <div class="rangee">${q.vOpts.map(v => `<div class="carte-lettre voyelle" data-type="v" data-l="${v}">${v}</div>`).join('')}</div></div>`;
    const poser = (type, l) => {
      if (api.verrouille || q.attente) return;
      q.place[type] = l;
      const c = $(`.case[data-case="${type}"]`, scene); c.textContent = l; c.classList.add('remplie');
      api.son('clic');
      if (q.place.c && q.place.v) { q.attente = true; api.plusTard(() => { q.attente = false; api.repondre(q.place.c + '|' + q.place.v); }, 450); }
    };
    $$('.carte-lettre', rep).forEach(carte => rendreDeplacable(carte, {
      cibles: () => $$('.case', scene),
      onDepot: () => poser(carte.dataset.type, carte.dataset.l),   // posée dans la bonne case selon son type
      onAppui: () => poser(carte.dataset.type, carte.dataset.l),   // alternative par simple appui
    }));
  },
  verifier(q, v) { return q.mode === 'construire' ? v === q.c + '|' + q.v : v === q.txt; },
  indice(q, api, v) {
    if (q.mode === 'construire') {
      const [c, vv] = String(v).split('|');
      if (c !== q.c) $$(`.carte-lettre[data-l="${c}"][data-type="c"]`).forEach(e => e.classList.add('ecarte'));
      if (vv !== q.v) $$(`.carte-lettre[data-l="${vv}"][data-type="v"]`).forEach(e => e.classList.add('ecarte'));
      q.place = { c: null, v: null };
      $$('.case').forEach(e => { e.textContent = ''; e.classList.remove('remplie'); });
      return { texte: 'Écoute bien les deux sons.', voix: `Écoute : ${direSon(q.c)}… ${direSon(q.v)}.` };
    }
    $$(`.btn-choix[data-r="${v}"]`).forEach(b => b.classList.add('ecarte'));
    return { texte: 'Touche les lettres pour les écouter.', voix: `Écoute bien : ${direSon(this.premier(q))}… ${direSon(this.second(q))}.` };
  },
  solution(q) {
    if (q.mode === 'construire') {
      const cs = $$('.case');
      cs[0].textContent = q.c; cs[1].textContent = q.v; cs.forEach(c => c.classList.add('remplie'));
      return { texte: `${q.c} et ${q.v}, ça fait « ${q.txt} ».`, voix: `${direSon(q.c)}… ${direSon(q.v)}… ça fait ${direSyllabe(q.txt)}.` };
    }
    this.bravo(q);
    $$('.btn-choix').forEach(b => b.classList.toggle('bonne', b.dataset.r === q.txt));
    return { texte: `${this.premier(q)} et ${this.second(q)}, ça fait « ${q.txt} ».`, voix: `${direSon(this.premier(q))}… ${direSon(this.second(q))}… ça fait ${direSyllabe(q.txt)}.` };
  },
  bravo(q, api) {
    const f = $('#fusion'), r = $('#resultat');
    if (f) f.classList.add('fusionne');
    if (r) { r.textContent = q.txt; r.classList.add('rempli'); }
    if (api) api.dire(direSyllabe(q.txt));
  },
  delaiBravo: 1100,
});

/* ---------------------------------------------------------------------
   JEU 6 — ATTRAPE LA SYLLABE (le cerceau)
   La voix dit une syllabe : il touche le cerceau qui la contient.
   Les cerceaux ne bougent pas (rien ne bouge pendant qu'il réfléchit).
   --------------------------------------------------------------------- */
enregistrerJeu({
  id:'attrape', nom:'Attrape la syllabe', niveau:'CP', matiere:'francais', agres:'cerceau', competence:'cp-syllabes',
  disposition:'plein',
  paliers: [
    { nom:'2 cerceaux, syllabes très différentes', periode:1, nb:2, pieges:'loin' },
    { nom:'3 cerceaux',                            periode:1, nb:3, pieges:'loin' },
    { nom:'4 cerceaux, syllabes qui se ressemblent',periode:1, nb:4, pieges:'proche' },
    { nom:'4 cerceaux avec syllabes à l’envers (la / al)', periode:2, nb:4, pieges:'proche', inversion:true },
    { nom:'6 cerceaux',                            periode:2, nb:6, pieges:'proche', inversion:true },
  ],
  generer(p) {
    const pool = syllabesCV();
    const cible = choix(pool);
    let pieges = distracteurs(cible, pool, p.nb - 1, p.pieges).map(s => s.txt);
    if (p.inversion) { // ajoute la syllabe à l'envers (la → al) parmi les pièges
      const inv = cible.v + cible.c;
      if (!pieges.includes(inv)) { if (pieges.length) pieges[pieges.length - 1] = inv; else pieges.push(inv); }
    }
    return { txt: cible.txt, c: cible.c, v: cible.v, choix: melanger([cible.txt, ...pieges]), cle: cible.txt };
  },
  consigne: q => ({ texte: 'Écoute et attrape la bonne syllabe.', voix: `Attrape… ${direSyllabe(q.txt)} !` }),
  afficher(q, scene, rep, api) {
    const n = q.choix.length;
    const portrait = window.innerHeight > window.innerWidth;
    const cols = portrait ? (n <= 2 ? 1 : 2) : (n <= 3 ? n : n === 4 ? 4 : 3);
    scene.innerHTML = `<div class="cerceaux" style="grid-template-columns:repeat(${cols},auto)">
      ${q.choix.map(t => `<button class="cerceau" data-r="${t}">${t}</button>`).join('')}</div>`;
    $$('[data-r]', scene).forEach(b => b.addEventListener('click', () => api.repondre(b.dataset.r)));
  },
  verifier: (q, v) => v === q.txt,
  indice(q, api, v) {
    $$(`.cerceau[data-r="${v}"]`).forEach(b => b.classList.add('ecarte'));
    return { texte: `Elle commence par « ${q.c} ».`, voix: `Elle commence par ${direSon(q.c)}. Écoute : ${direSyllabe(q.txt)}.` };
  },
  solution(q) {
    $$('.cerceau').forEach(b => { if (b.dataset.r === q.txt) b.classList.add('bonne'); else b.classList.add('ecarte'); });
    return { texte: `C’était « ${q.txt} » : ${q.c} et ${q.v}.`, voix: `C’était ${direSyllabe(q.txt)} : ${direSon(q.c)}… ${direSon(q.v)}… ${direSyllabe(q.txt)}.` };
  },
  bravo(q) { $$('.cerceau').forEach(b => { if (b.dataset.r === q.txt) b.classList.add('bonne'); }); },
});

/* ---------------------------------------------------------------------
   JEU 7 — LE VESTIAIRE (compléments) : remplir les casiers pour arriver à 10
   --------------------------------------------------------------------- */
enregistrerJeu({
  id:'vestiaire', nom:'Le vestiaire', niveau:'CP', matiere:'maths', agres:'vestiaire', competence:'cp-complements',
  disposition:'deux',
  paliers: [
    { nom:'Compléter à 5 en remplissant les casiers',  periode:1, cible:5,  casiers:'toucher' },
    { nom:'Compléter à 10 en remplissant les casiers', periode:1, cible:10, casiers:'toucher' },
    { nom:'Compléter à 10 en regardant les casiers',   periode:1, cible:10, casiers:'voir' },
    { nom:'Compléter à 10 de tête',                     periode:2, cible:10, casiers:'non' },
    { nom:'Compléter à 20 en regardant les casiers',   periode:3, cible:20, casiers:'voir' },
    { nom:'Compléter à 20 de tête',                     periode:3, cible:20, casiers:'non' },
  ],
  generer(p) {
    const a = rnd(p.cible === 20 ? 8 : 1, p.cible - 1);
    return { a, cible: p.cible, manque: p.cible - a, casiers: p.casiers, cle: a + '/' + p.cible };
  },
  consigne: q => ({ texte: `Range les sacs pour arriver à ${q.cible}.`, voix: `${q.a} et combien pour faire ${q.cible} ?` }),
  /* Casiers en boîtes de 5 (2 rangées de 5 = 10), repère 600 × 400 */
  casiersSVG(q) {
    const rangs = q.cible / 5, h = rangs > 2 ? 82 : 120, y0 = rangs > 2 ? 30 : (rangs === 1 ? 140 : 80);
    let s = '';
    for (let i = 0; i < q.cible; i++) {
      const r = Math.floor(i / 5), x = 50 + (i % 5) * 100, y = y0 + r * h + (r >= 2 ? 12 : 0);
      const plein = i < q.a;
      s += `<g class="casier" data-i="${i}" ${plein ? '' : 'style="cursor:pointer"'}><rect x="${x}" y="${y}" width="96" height="${h - 6}" rx="8" fill="${plein ? '#9FB6D6' : '#fff'}" stroke="#56607A" stroke-width="3"/>`
        + (plein ? svgSac(x + 48, y + h / 2, h * .8, '#1D4E89') : '') + `<g class="contenu"></g></g>`;
    }
    return `<svg class="svg-scene" id="casiers" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
  },
  afficher(q, scene, rep, api) {
    q.ajoutes = 0;
    scene.innerHTML = `<div class="scene-col"><div class="calcul">${q.a} + <span class="trou" id="trou">?</span> = ${q.cible}</div>
      <div id="zone-casiers" style="width:100%;flex:1;min-height:0;display:${q.casiers === 'non' ? 'none' : 'flex'}">${this.casiersSVG(q)}</div></div>`;
    this.brancher(q, api, q.casiers === 'toucher');
    api.pave(rep, { max: 2 });
  },
  /* Toucher un casier vide y range un sac (manipulation) */
  brancher(q, api, actif) {
    if (!actif) return;
    $$('#casiers .casier').forEach(g => {
      const i = Number(g.dataset.i);
      if (i < q.a) return;
      g.addEventListener('click', () => {
        if (g.dataset.rempli || api.verrouille) return;
        g.dataset.rempli = '1'; q.ajoutes++;
        const r = $('rect', g), x = +r.getAttribute('x'), y = +r.getAttribute('y'), h = +r.getAttribute('height') + 6;
        $('.contenu', g).innerHTML = svgSac(x + 48, y + h / 2, h * .8, '#EF8A17') + `<text x="${x + 84}" y="${y + 20}" font-size="20" font-weight="700" fill="#D9620F" text-anchor="middle">${q.ajoutes}</text>`;
        api.son('clic'); api.dire(String(q.ajoutes));
      });
    });
  },
  verifier: (q, v) => Number(v) === q.manque,
  indice(q, api) {
    const z = $('#zone-casiers');
    if (z.style.display === 'none') { z.style.display = 'flex'; z.innerHTML = this.casiersSVG(q); this.brancher(q, api, true); }
    $$('#casiers .casier').forEach(g => { if (+g.dataset.i >= q.a && !g.dataset.rempli) $('rect', g).setAttribute('stroke', '#D9620F'); });
    return 'Compte les casiers vides.';
  },
  solution(q) {
    const z = $('#zone-casiers'); z.style.display = 'flex'; z.innerHTML = this.casiersSVG(q);
    let k = 0;
    $$('#casiers .casier').forEach(g => {
      if (+g.dataset.i < q.a) return;
      k++; const r = $('rect', g), x = +r.getAttribute('x'), y = +r.getAttribute('y'), h = +r.getAttribute('height') + 6;
      $('.contenu', g).innerHTML = svgSac(x + 48, y + h / 2, h * .8, '#23804D') + `<text x="${x + 84}" y="${y + 20}" font-size="20" font-weight="700" fill="#23804D" text-anchor="middle">${k}</text>`;
    });
    const t = $('#trou'); t.textContent = q.manque; t.classList.add('rempli');
    return `${q.a} et ${q.manque}, ça fait ${q.cible}.`;
  },
  bravo(q) { const t = $('#trou'); if (t) { t.textContent = q.manque; t.classList.add('rempli'); } },
});

/* ---------------------------------------------------------------------
   JEU 8 — LES BARRES ASYMÉTRIQUES (soustraire) : des objets tombent de la barre
   --------------------------------------------------------------------- */
enregistrerJeu({
  id:'barres', nom:'Les barres asymétriques', niveau:'CP', matiere:'maths', agres:'barres', competence:'cp-soustraction',
  disposition:'deux',
  paliers: [
    { nom:'Enlever 1 ou 2 (jusqu’à 5) en faisant tomber les objets', periode:1, nMin:3, nMax:5,  bMax:2, objets:'toucher' },
    { nom:'Enlever jusqu’à 3 (jusqu’à 10) en faisant tomber les objets', periode:1, nMin:5, nMax:10, bMax:3, objets:'toucher' },
    { nom:'Enlever jusqu’à 5 (jusqu’à 10) en regardant les objets', periode:2, nMin:5, nMax:10, bMax:5, objets:'voir' },
    { nom:'Soustraire jusqu’à 10 de tête',                     periode:2, nMin:4, nMax:10, bMax:6, objets:'non' },
    { nom:'Soustraire jusqu’à 20 de tête',                     periode:3, nMin:11, nMax:20, bMax:9, objets:'non' },
  ],
  generer(p) {
    const n = rnd(p.nMin, p.nMax), b = rnd(1, Math.min(p.bMax, n - 1));
    return { n, b, r: n - b, objets: p.objets, objet: choix(OBJETS_GYM), cle: n + '-' + b };
  },
  consigne: q => ({ texte: 'Combien en reste-t-il ?', voix: `${q.n} moins ${q.b}, combien en reste-t-il ?` }),
  /* Les objets pendent à la barre haute (10 max), puis à la barre basse */
  place(i) { const bas = i >= 10, k = i % 10; return { x: 70 + k * 54, y: bas ? 236 : 116, fil: bas ? 196 : 76 }; },
  barresSVG(q) {
    let s = `<line x1="40" y1="76" x2="600" y2="76" stroke="#C98B4A" stroke-width="12" stroke-linecap="round"/>`;
    if (q.n > 10) s += `<line x1="40" y1="196" x2="600" y2="196" stroke="#C98B4A" stroke-width="12" stroke-linecap="round"/>`;
    s += `<rect x="20" y="360" width="600" height="24" rx="12" fill="#2F6FD0" opacity=".35"/>`;
    for (let i = 0; i < q.n; i++) {
      const { x, y, fil } = this.place(i);
      s += `<g class="pendu" data-i="${i}" style="cursor:pointer;transition:transform .6s ease-in"><line x1="${x}" y1="${fil}" x2="${x}" y2="${y - 20}" stroke="#56607A" stroke-width="2"/>${svgObjet(q.objet, x, y, 44)}<rect x="${x - 26}" y="${fil}" width="52" height="${y - fil + 26}" fill="transparent"/></g>`;
    }
    return `<svg class="svg-scene" id="barres" viewBox="0 0 640 390" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
  },
  faireTomber(g, i) {
    g.dataset.tombe = '1';
    const { y } = this.place(i);
    g.style.transform = `translateY(${340 - y}px)`;
    $('line', g).style.display = 'none';
    g.style.opacity = '.45';
  },
  afficher(q, scene, rep, api) {
    q.tombes = 0;
    scene.innerHTML = `<div class="scene-col"><div class="calcul">${q.n} − ${q.b} = <span class="trou" id="trou">?</span></div>
      <div id="zone-barres" style="width:100%;flex:1;min-height:0;display:${q.objets === 'non' ? 'none' : 'flex'}">${this.barresSVG(q)}</div></div>`;
    this.brancher(q, api, q.objets === 'toucher');
    api.pave(rep, { max: 2 });
  },
  brancher(q, api, actif) {
    if (!actif) return;
    $$('#barres .pendu').forEach(g => g.addEventListener('click', () => {
      if (g.dataset.tombe || api.verrouille) return;
      this.faireTomber(g, +g.dataset.i); q.tombes++;
      api.son('boing');
    }));
  },
  verifier: (q, v) => Number(v) === q.r,
  indice(q, api) {
    const z = $('#zone-barres');
    if (z.style.display === 'none') { z.style.display = 'flex'; z.innerHTML = this.barresSVG(q); this.brancher(q, api, true); q.tombes = 0; }
    return q.objets === 'voir' || q.objets === 'non' ? `Fais tomber ${q.b} objet${q.b > 1 ? 's' : ''}, puis compte ceux qui restent.` : 'Compte les objets qui restent sur la barre.';
  },
  solution(q) {
    const z = $('#zone-barres'); z.style.display = 'flex'; z.innerHTML = this.barresSVG(q);
    const gs = $$('#barres .pendu');
    gs.forEach((g, i) => {
      if (i >= q.n - q.b) this.faireTomber(g, i);
      else { const { x, fil } = this.place(i); g.insertAdjacentHTML('beforeend', `<circle cx="${x + 20}" cy="${fil + 14}" r="14" fill="#23804D"/><text x="${x + 20}" y="${fil + 15}" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">${i + 1}</text>`); }
    });
    const t = $('#trou'); t.textContent = q.r; t.classList.add('rempli');
    return `${q.n} − ${q.b} = ${q.r}. ${q.b} objet${q.b > 1 ? 's tombent' : ' tombe'}, il en reste ${q.r}.`;
  },
  bravo(q) { const t = $('#trou'); if (t) { t.textContent = q.r; t.classList.add('rempli'); } },
});

/* ---------------------------------------------------------------------
   Outils des jeux de mots : on choisit d'abord les mots que l'enfant peut lire
   --------------------------------------------------------------------- */
function motsLisibles(nbSyllabes) {
  const vus = etat.reglages.sonsVus;
  const tous = CONTENUS.mots.filter(m => !nbSyllabes || m.syllabes.length === nbSyllabes);
  const lisibles = tous.filter(m => m.sons.split(' ').every(s => vus.includes(s)));
  return lisibles.length >= 4 ? lisibles : melanger(tous).sort((a, b) => b.sons.split(' ').filter(s => vus.includes(s)).length / b.sons.split(' ').length - a.sons.split(' ').filter(s => vus.includes(s)).length / a.sons.split(' ').length).slice(0, Math.max(4, lisibles.length));
}
const motDit = m => m.syllabes.map(direSyllabe).join('… ');

/* ---------------------------------------------------------------------
   JEU 9 — CONSTRUIS LE MOT (les anneaux) : remettre les syllabes dans l'ordre
   --------------------------------------------------------------------- */
enregistrerJeu({
  id:'construis', nom:'Construis le mot', niveau:'CP', matiere:'francais', agres:'anneaux', competence:'cp-encoder',
  disposition:'deux',
  paliers: [
    { nom:'Mots de 2 syllabes',                periode:1, nb:2, pieges:0 },
    { nom:'Mots de 2 syllabes avec un piège',  periode:1, nb:2, pieges:1 },
    { nom:'Mots de 3 syllabes',                periode:1, nb:3, pieges:0 },
    { nom:'Mots de 3 syllabes avec 2 pièges',  periode:2, nb:3, pieges:2 },
  ],
  generer(p) {
    const m = choix(motsLisibles(p.nb));
    const autres = [...new Set(CONTENUS.mots.flatMap(x => x.syllabes))].filter(s => !m.syllabes.includes(s));
    const cartes = melanger([...m.syllabes, ...melanger(autres).slice(0, p.pieges)]);
    return { m, cartes, cle: m.mot };
  },
  consigne: q => ({ texte: 'Construis le mot.', voix: `Construis le mot : ${q.m.mot}.` }),
  afficher(q, scene, rep, api) {
    q.cases = q.m.syllabes.map(() => null);
    scene.innerHTML = `<div class="scene-col">
      <div class="rangee" style="align-items:center;gap:3vmin">${svgDessin(q.m.dessin, 'dessin-grand')}
        <button class="ecoute-grand" id="ecoute-mot" aria-label="Écouter le mot">${ICONES.haut}</button></div>
      <div class="cases">${q.m.syllabes.map((_, i) => `<div class="case case-syl" data-case="${i}"></div>`).join('')}</div></div>`;
    $('#ecoute-mot', scene).addEventListener('click', () => api.dire(q.m.mot));
    rep.innerHTML = `<div class="rangee" style="flex-wrap:wrap;max-width:440px">${q.cartes.map((s, i) => `<div class="carte-lettre carte-syl" data-c="${i}">${s}</div>`).join('')}</div>`;
    const placer = (ci, caseIdx) => {
      if (api.verrouille || q.attente) return;
      if (caseIdx === undefined) caseIdx = q.cases.findIndex(c => c === null);
      if (caseIdx < 0 || caseIdx === q.fixe) return;
      const ancienne = q.cases.indexOf(ci); if (ancienne >= 0) q.cases[ancienne] = null;
      if (q.cases[caseIdx] !== null) $(`.carte-syl[data-c="${q.cases[caseIdx]}"]`, rep).classList.remove('posee');
      q.cases[caseIdx] = ci;
      $(`.carte-syl[data-c="${ci}"]`, rep).classList.add('posee');
      this.majCases(q);
      api.son('clic');
      if (q.cases.every(c => c !== null)) { q.attente = true; api.plusTard(() => { q.attente = false; api.repondre(q.cases.map(c => q.cartes[c]).join('|')); }, 500); }
    };
    $$('.carte-syl', rep).forEach(c => rendreDeplacable(c, {
      cibles: () => $$('.case-syl', scene),
      onDepot: cible => placer(+c.dataset.c, +cible.dataset.case),
      onAppui: () => placer(+c.dataset.c),
    }));
    // toucher une case remplie rend la syllabe
    $$('.case-syl', scene).forEach(cs => cs.addEventListener('click', () => {
      const i = +cs.dataset.case; if (q.cases[i] === null || api.verrouille || q.fixe === i) return;
      $(`.carte-syl[data-c="${q.cases[i]}"]`, rep).classList.remove('posee');
      q.cases[i] = null; this.majCases(q);
    }));
  },
  majCases(q) {
    $$('.case-syl').forEach((cs, i) => { cs.textContent = q.cases[i] === null ? '' : q.cartes[q.cases[i]]; cs.classList.toggle('remplie', q.cases[i] !== null); });
  },
  verifier: (q, v) => v === q.m.syllabes.join('|'),
  /* Indice : on vide, puis on pose la 1re syllabe à sa place */
  indice(q, api) {
    q.cases = q.m.syllabes.map(() => null);
    $$('.carte-syl').forEach(c => c.classList.remove('posee'));
    const ci = q.cartes.indexOf(q.m.syllabes[0]);
    q.cases[0] = ci; q.fixe = 0; $(`.carte-syl[data-c="${ci}"]`).classList.add('posee');
    this.majCases(q);
    return { texte: 'Écoute les syllabes, dans l’ordre.', voix: `Écoute : ${motDit(q.m)}.` };
  },
  solution(q) {
    q.cases = q.m.syllabes.map(s => q.cartes.indexOf(s)); this.majCases(q);
    $$('.carte-syl').forEach(c => c.classList.add('posee'));
    return { texte: `${q.m.syllabes.join(' – ')} : ${q.m.mot}.`, voix: `${motDit(q.m)}… ${q.m.mot}.` };
  },
  bravo(q, api) { api.dire(q.m.mot); },
  delaiBravo: 900,
});

/* ---------------------------------------------------------------------
   JEU 10 — MOT ET IMAGE (la table de saut) : lire le mot, toucher le bon dessin
   La voix ne lit pas le mot : c'est l'enfant qui lit.
   --------------------------------------------------------------------- */
enregistrerJeu({
  id:'motimage', nom:'Mot et image', niveau:'CP', matiere:'francais', agres:'saut', competence:'cp-lire-mots',
  disposition:'plein',
  paliers: [
    { nom:'2 dessins très différents',          periode:1, nb:2, proches:false },
    { nom:'3 dessins',                          periode:1, nb:3, proches:false },
    { nom:'4 dessins',                          periode:1, nb:4, proches:false },
    { nom:'4 dessins, mots qui commencent pareil', periode:2, nb:4, proches:true },
  ],
  generer(p) {
    const m = choix(motsLisibles());
    const autres = CONTENUS.mots.filter(x => x.mot !== m.mot);
    let pieges;
    if (p.proches) pieges = [...melanger(autres.filter(x => x.mot[0] === m.mot[0] || x.syllabes.length === m.syllabes.length))].slice(0, p.nb - 1);
    else pieges = melanger(autres.filter(x => x.mot[0] !== m.mot[0])).slice(0, p.nb - 1);
    if (pieges.length < p.nb - 1) pieges = pieges.concat(melanger(autres.filter(x => !pieges.includes(x))).slice(0, p.nb - 1 - pieges.length));
    return { m, choix: melanger([m, ...pieges]), cle: m.mot };
  },
  consigne: () => ({ texte: 'Lis le mot, puis touche le bon dessin.', voix: 'Lis le mot, puis touche le bon dessin.' }),
  afficher(q, scene, rep, api) {
    scene.innerHTML = `<div class="scene-col">
      <div class="mot-lire" id="mot-lire">${q.m.mot}</div>
      <div class="rangee" style="gap:2.5vmin;flex-wrap:wrap">${q.choix.map(x => `<button class="carte-dessin" data-r="${x.mot}">${svgDessin(x.dessin)}</button>`).join('')}</div></div>`;
    $$('[data-r]', scene).forEach(b => b.addEventListener('click', () => api.repondre(b.dataset.r)));
  },
  verifier: (q, v) => v === q.m.mot,
  /* Indice : le mot est découpé en syllabes de deux couleurs */
  indice(q, api, v) {
    $$(`.carte-dessin[data-r="${v}"]`).forEach(b => b.classList.add('ecarte'));
    $('#mot-lire').innerHTML = q.m.syllabes.map((s, i) => `<span class="${i % 2 ? 'syl-b' : 'syl-a'}">${s}</span>`).join('');
    return 'Lis une syllabe après l’autre.';
  },
  solution(q) {
    $$('.carte-dessin').forEach(b => b.classList.toggle('ecarte', b.dataset.r !== q.m.mot));
    $$('.carte-dessin').forEach(b => b.classList.toggle('bonne', b.dataset.r === q.m.mot));
    return { texte: `C’était « ${q.m.mot} ».`, voix: `${motDit(q.m)}… ${q.m.mot} !` };
  },
  bravo(q) { $$('.carte-dessin').forEach(b => b.classList.toggle('bonne', b.dataset.r === q.m.mot)); },
});

/* =====================================================================
   15. ÉCRAN D'ACCUEIL ET CHOIX DE L'AGRÈS
   ===================================================================== */
function majAccueil() {
  const niv = NIVEAUX.find(n => n.id === etat.reglages.niveau) || NIVEAUX[0];
  $('#accueil-gymnase').textContent = niv.gymnase;
  $('#accueil-gym').innerHTML = svgGymnaste();
  $('#accueil-nom').textContent = etat.profil.prenom;
}
/* Choix de l'agrès : une matière à la fois (Nombres ou Lecture), pour garder un écran léger */
let matiereAgres = 'maths';
function montrerAgres(matiere) {
  if (matiere) matiereAgres = matiere;
  const jeux = jeuxDuNiveau().filter(j => j.matiere === matiereAgres);
  const agresDuNiveau = [...new Set(jeux.map(j => j.agres))];
  $('#agres-titre').textContent = 'Choisis ton agrès';
  $('#agres-matieres').style.display = '';
  $$('#agres-matieres [data-matiere]').forEach(b => b.classList.toggle('blanc', b.dataset.matiere !== matiereAgres));
  $('#grille-agres').innerHTML = agresDuNiveau.map(a => {
    const js = jeux.filter(j => j.agres === a);
    const mat = js[0].matiere;
    return `<button class="carte-agres ${mat}" data-agres="${a}">${svgAgres(AGRES[a].icone)}
      <span class="t">${AGRES[a].nom}</span></button>`;
  }).join('');
  $$('[data-agres]').forEach(b => b.addEventListener('click', () => {
    const js = jeux.filter(j => j.agres === b.dataset.agres);
    if (js.length === 1) lancerJeu(js[0].id);
    else montrerJeuxAgres(b.dataset.agres, js);
  }));
  montrer('ecran-agres');
}
/* Un agrès qui contient plusieurs jeux (prévu pour les prochaines versions) */
function montrerJeuxAgres(agres, js) {
  $('#agres-titre').textContent = AGRES[agres].nom;
  $('#agres-matieres').style.display = 'none';
  $('#grille-agres').innerHTML = js.map(j => `<button class="carte-agres ${j.matiere}" data-jeu="${j.id}">${svgAgres(AGRES[agres].icone)}<span class="t">${j.nom}</span></button>`).join('');
  $$('[data-jeu]').forEach(b => b.addEventListener('click', () => lancerJeu(b.dataset.jeu)));
}

/* =====================================================================
   16. VITRINE DES MÉDAILLES ET RÉCOMPENSES
   ===================================================================== */
function montrerVitrine() {
  const n = t => etat.medailles.filter(m => m.type === t).length;
  const pts = pointsMedailles(), proch = prochaineRecompense();
  const carte = (r, contenu) => `<div class="recomp ${estDebloque(r) ? '' : 'verrou'}">${contenu}<span>${estDebloque(r) ? r.nom : ICONES.cadenas + ' ' + r.nom}</span></div>`;
  const apercu = modif => svgGymnaste({ ...etat.profil, ...modif });
  $('#vitrine-corps').innerHTML = `
    <div class="etagere">
      <div class="m">${svgMedaille('or')}${n('or')}</div>
      <div class="m">${svgMedaille('argent')}${n('argent')}</div>
      <div class="m">${svgMedaille('bronze')}${n('bronze')}</div>
    </div>
    <div class="prochain">${proch ? `Encore ${proch.points - pts} point${proch.points - pts > 1 ? 's' : ''} pour débloquer : ${proch.nom.toLowerCase()} !` : 'Tu as tout débloqué, champion !'}</div>

/* =====================================================================
   17. CRÉATION DU GYMNASTE ET VESTIAIRE (une seule question par écran)
   ===================================================================== */
let crea = null;
const ETAPES_CREA = [
  { id:'prenom',    q:'Comment s’appelle ton gymnaste ?' },
  { id:'peau',      q:'Choisis la couleur de peau.' },
  { id:'cheveux',   q:'Choisis la couleur des cheveux.' },
  { id:'coiffure',  q:'Choisis la coiffure.' },
  { id:'tenue',     q:'Choisis la tenue.' },
  { id:'couleur',   q:'Choisis la couleur de la tenue.' },
  { id:'accessoire',q:'Choisis un accessoire.' },
];
/* L'étape « accessoire » n'apparaît que lorsqu'un accessoire a été gagné */
const derniereEtape = () => RECOMPENSES.accessoires.some(a => a.id !== 'aucun' && estDebloque(a)) ? ETAPES_CREA.length - 1 : ETAPES_CREA.length - 2;
function ouvrirCreation(vestiaire) {
  crea = { etape: vestiaire ? 1 : 0, profil: { ...etat.profil }, vestiaire };
  montrer('ecran-creation');
  etapeCreation();
}
function etapeCreation() {
  const e = ETAPES_CREA[crea.etape], p = crea.profil;
  $('#crea-titre').textContent = crea.vestiaire ? 'Ma tenue' : 'Ton gymnaste';
  $('#crea-apercu').innerHTML = svgGymnaste(p);
  $('#crea-precedent').style.visibility = (crea.etape === 0 && !crea.vestiaire) ? 'hidden' : 'visible';
  $('#crea-suivant').textContent = crea.etape >= derniereEtape() ? 'Terminé' : 'Suivant';
  const droite = $('#crea-droite');
  let opts = '';
  if (e.id === 'prenom') {
    const lettres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÉÈÏ-'.split('');
    droite.innerHTML = `<div class="crea-question">${e.q}</div>
      <div class="nom-affiche" id="nom-affiche">${echapper(p.prenom) || '&nbsp;'}</div>
      <div class="pave-lettres">${lettres.map(l => `<button class="touche" data-l="${l}">${l}</button>`).join('')}<button class="touche efface" data-l="efface" aria-label="Effacer">${ICONES.effacer}</button></div>`;
    $$('[data-l]', droite).forEach(b => b.addEventListener('click', () => {
      const l = b.dataset.l;
      if (l === 'efface') p.prenom = p.prenom.slice(0, -1);
      else if (p.prenom.length < 12) p.prenom = p.prenom.length === 0 ? l : p.prenom + l.toLowerCase();
      Sons.jouer('clic');
      $('#nom-affiche').innerHTML = echapper(p.prenom) || '&nbsp;';
    }));
    Voix.dire(e.q);
    return;
  }
  const option = (valeur, contenu, verrou) => `<button class="opt ${p[e.id] === valeur ? 'choisi' : ''} ${verrou ? 'verrou' : ''}" data-v="${valeur}" ${verrou ? 'data-verrou="1"' : ''}>${contenu}</button>`;
  if (e.id === 'peau') opts = PEAUX.map((c, i) => option(i, `<span class="pastille-couleur" style="background:${c}"></span>`)).join('');
  if (e.id === 'cheveux') opts = CHEVEUX.map((c, i) => option(i, `<span class="pastille-couleur" style="background:${c}"></span>`)).join('');
  if (e.id === 'couleur') opts = COULEURS_TENUE.map(c => option(c.id, `<span class="pastille-couleur" style="background:${c.hex}"></span>`)).join('');
  if (e.id === 'coiffure') opts = COIFFURES.map(c => option(c.id, svgGymnaste({ ...p, coiffure: c.id }))).join('');
  if (e.id === 'tenue') opts = RECOMPENSES.tenues.map(t => option(t.id, svgGymnaste({ ...p, tenue: t.id }), !estDebloque(t))).join('');
  if (e.id === 'accessoire') opts = RECOMPENSES.accessoires.map(a => option(a.id, a.id === 'aucun' ? '<span style="font-size:clamp(18px,2.8vmin,26px);font-weight:700">Aucun</span>' : svgGymnaste({ ...p, accessoire: a.id }), !estDebloque(a))).join('');
  droite.innerHTML = `<div class="crea-question">${e.q}</div><div class="options">${opts}</div>`;
  $$('.opt', droite).forEach(b => b.addEventListener('click', () => {
    if (b.dataset.verrou) {
      const item = [...RECOMPENSES.tenues, ...RECOMPENSES.accessoires].find(r => r.id === b.dataset.v);
      Voix.dire(`Gagne encore ${item.points - pointsMedailles()} points de médailles pour l’avoir !`);
      return;
    }
    const v = b.dataset.v;
    p[e.id] = (e.id === 'peau' || e.id === 'cheveux') ? Number(v) : v;
    Sons.jouer('clic');
    etapeCreation();
  }));
  if (!crea.dejaDit || crea.dejaDit !== crea.etape) { Voix.dire(e.q); crea.dejaDit = crea.etape; }
}
function creaSuivant() {
  if (crea.etape === 0 && !crea.profil.prenom) { Voix.dire('Écris le prénom avec les lettres.'); return; }
  if (crea.etape < derniereEtape()) { crea.etape++; etapeCreation(); return; }
  etat.profil = { ...crea.profil, cree: true };
  sauver();
  allerAccueil();
  Sons.jouer('fanfare');
  Voix.dire(crea.vestiaire ? 'Super tenue !' : `Bienvenue au club, ${etat.profil.prenom} !`);
}
function creaPrecedent() {
  if (crea.etape === 0 || (crea.vestiaire && crea.etape === 1)) { if (crea.vestiaire) allerAccueil(); return; }
  crea.etape--; etapeCreation();
}

let porte = null;
function ouvrirPorte() {
  const a = rnd(6, 9), b = rnd(6, 9);
  porte = a * b;
  $('#porte-calcul').textContent = `${a} × ${b} = ?`;
  $('#porte-msg').textContent = '';

  } });
  Voix.taire();
  montrer('ecran-porte');
}

const fmtMin = s => { const m = Math.round(s / 60); return m < 1 ? (s > 0 ? '< 1 min' : '0 min') : m + ' min'; };
function pageSuivi() {
  // temps joué : 7 derniers jours

  }).join('');
  const jeux = jeuxDuNiveau();

    return `<tr><td>${j.nom}</td><td style="text-align:right">${etat.stats.jeux[j.id] || 0} série(s)</td><td style="text-align:right">or ${med('or')} · argent ${med('argent')} · bronze ${med('bronze')}</td></tr>`;
  }).join('');
  const comps = jeux.map(j => {

    <h3>Compétences maîtrisées</h3><div class="bloc">${maitrisees.length ? maitrisees.join('<br>') : '<span class="note">Aucune pour l’instant : une compétence est maîtrisée quand il réussit bien au dernier palier.</span>'}</div>
    <h3>Jeux faits</h3><div class="bloc"><table class="tableau">${lignesJ}</table></div>`;

const bascule = (cle, val, libelle, oui) => `<button class="bascule ${oui ? 'oui' : ''}" data-cle="${cle}" data-val="${val}">${libelle}</button>`;

function brancherReglages() {
  const r = etat.reglages;
  $$('#parent-corps .bascule').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.val;
    switch (b.dataset.cle) {
      case 'niveau':   r.niveau = v; break;
      case 'periode':  r.periode = Number(v); break;
      case 'son':      r.sonsVus = r.sonsVus.includes(v) ? r.sonsVus.filter(x => x !== v) : [...r.sonsVus, v]; break;
      case 'priorite': r.priorites = r.priorites.includes(v) ? r.priorites.filter(x => x !== v) : [...r.priorites, v]; break;
      case 'duree':    r.dureeSeance = Number(v); if (seance.debut) seance.fin = seance.debut + r.dureeSeance * 60000; break;
      case 'pauses':   r.pauses = v === '1'; break;
      case 'lecture':  r.lectureAuto = v === '1'; break;
      case 'sons':     r.sons = v === '1'; break;
      case 'vitesse':  r.vitesseVoix = Number(v); break;
      case 'nomVoix':  r.nomVoix = v; Voix.choisir && Voix.choisir(); Voix.dire('Bonjour ! Je lis les consignes du jeu.'); break;
    }
    sauver();
    const y = $('#parent-corps').scrollTop;
    montrerParent();
    $('#parent-corps').scrollTop = y;

}

function importerTexte(t) {
  try {
    const obj = JSON.parse(t);
    if (!obj || !obj.profil || !obj.reglages) throw new Error('format');
    etat = fusionner(etatParDefaut(), obj);
    sauver();
    $('#msg-sauvegarde').textContent = 'Sauvegarde importée.';
    setTimeout(montrerParent, 800);
  } catch (e) { $('#msg-sauvegarde').textContent = 'Ce fichier n’est pas une sauvegarde valide.'; }
}
function brancherSauvegarde() {
  $('#exporter').addEventListener('click', () => {
    try {
      const blob = new Blob([JSON.stringify(etat, null, 1)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${CONFIG.nomAppli.replace(/[^a-z0-9]/gi, '')}-sauvegarde-${aujourdhui()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      $('#msg-sauvegarde').textContent = 'Fichier de sauvegarde créé.';
    } catch (e) { $('#msg-sauvegarde').textContent = 'Utilisez plutôt le texte ci-dessous.'; }
  });
  $('#importer').addEventListener('click', () => $('#fichier-import').click());
  $('#fichier-import').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const lecteur = new FileReader();
    lecteur.onload = () => importerTexte(lecteur.result);
    lecteur.readAsText(f);
  });
  $('#coller').addEventListener('click', () => {
    const t = prompt('Collez ici le texte de la sauvegarde :');
    if (t) importerTexte(t);
  });
  $('#texte-sauvegarde').addEventListener('focus', e => e.target.select());
  $('#effacer').addEventListener('click', () => {
    if (confirm('Effacer toute la progression, les médailles et le gymnaste ? Pensez à exporter avant.')) {
      etat = etatParDefaut(); sauver(); terminerSeance(); ouvrirCreation(false);
    }
  });
}

/* =====================================================================
   20. DÉMARRAGE
   ===================================================================== */
function brancherBoutons() {
  $('#btn-surprise').addEventListener('click', () => lancerJeu(jeuSuivant()));
  $('#btn-agres').addEventListener('click', () => montrerAgres());
  $$('#agres-matieres [data-matiere]').forEach(b => b.addEventListener('click', () => montrerAgres(b.dataset.matiere)));
  $('#btn-vitrine').addEventListener('click', montrerVitrine);
  $('#btn-vestiaire').addEventListener('click', () => ouvrirCreation(true));
  $('#btn-parents').addEventListener('click', ouvrirPorte);
  $$('[data-retour="accueil"]').forEach(b => b.addEventListener('click', allerAccueil));
  $('#jeu-maison').addEventListener('click', allerAccueil);
  $('#jeu-ecouter').addEventListener('click', () => Voix.dire(Voix.dernier));
  $('#btn-continuer').addEventListener('click', () => { Voix.taire(); questionSuivante(); });
  $('#medaille-suivant').addEventListener('click', () => apresSerie('suivant'));
  $('#medaille-accueil').addEventListener('click', () => apresSerie('accueil'));
  $('#fin-aurevoir').addEventListener('click', () => { terminerSeance(); allerAccueil(); });
  $('#fin-continuer').addEventListener('click', () => { seance.fin = Date.now() + 5 * 60000; allerAccueil(); });
  $('#crea-suivant').addEventListener('click', creaSuivant);
  $('#crea-precedent').addEventListener('click', creaPrecedent);
}
/* Tablette : pas de menu au appui long, pas de zoom par pincement ou double-tap */
function protegerTactile() {
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('pointerdown', () => Sons.activer(), { once: true });
}
/* « Ajouter à l'écran d'accueil » : icône dessinée + manifeste générés à la volée */
function preparerInstallation() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const x = c.getContext('2d');
    x.fillStyle = '#1D4E89'; x.fillRect(0, 0, 512, 512);
    x.fillStyle = '#F6C83B'; x.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 90 : 210; x.lineTo(256 + r * Math.cos(a), 270 + r * Math.sin(a)); }
    x.closePath(); x.fill();
    x.fillStyle = '#FFFFFF'; x.font = 'bold 120px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('+', 256, 280);
    const icone = c.toDataURL('image/png');
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = icone; document.head.appendChild(l);
    const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = icone; document.head.appendChild(fav);
    if (location.protocol.startsWith('http')) {
      const man = { name: CONFIG.nomAppli, short_name: CONFIG.nomAppli, start_url: location.href.split('#')[0], display: 'standalone', background_color: '#FFF7EC', theme_color: '#1D4E89', orientation: 'any', icons: [{ src: icone, sizes: '512x512', type: 'image/png' }] };
      const m = document.createElement('link'); m.rel = 'manifest';
      m.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
      document.head.appendChild(m);
      // Hors ligne une fois installée : si le fichier sw.js est posé à côté de index.html
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (e) { /* facultatif */ }
}
function demarrer() {
  document.title = CONFIG.nomAppli;
  $$('[data-ico]').forEach(e => { e.outerHTML = ICONES[e.dataset.ico]; });
  Voix.init();
  brancherBoutons();
  protegerTactile();
  preparerInstallation();
  if (!etat.profil.cree) ouvrirCreation(false);
  else allerAccueil();
}
demarrer();
// Accès pour les tests et le débogage (console du navigateur)
window.APP = { etat: () => etat, JEUX, lancerJeu, seance, get Q() { return Q; }, repondre, sauver };
</script>
